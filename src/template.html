let LIST_PAGE = 0;
const PANEL_TITLE = {prayers:'مواقيت الصلاة', forecast:'الطقس', matches:'مباريات فرقك القادمة'};

// «auto»: the four cards in turn, every 30 s; one with nothing to show right now (no forecast offline, no games
// this week) is skipped. PANEL is the card on screen.
const CARDS = ['verse', 'prayers', 'forecast', 'matches'];
const ROTATE_MS = 30 * 1000;
let PANEL = CONFIG.panel === 'auto' ? CARDS[0] : CONFIG.panel;
const wants = k => CONFIG.panel === 'auto' ? CARDS.includes(k) : CONFIG.panel === k;   // data this setting needs
function hasCard(k){
  if(k === 'prayers') return PRAYERS.length > 0;
  if(k === 'forecast') return FORECAST.length > 0;
  if(k === 'matches') return CONFIG.teamIds.length > 0 && matchRows().length > 0;   // no team picked: never in turn
  return true;
}
function rotateCard(){
  if(CONFIG.panel !== 'auto' || PANEL === 'adhkar') return;
  for(let i = 1; i <= CARDS.length; i++){
    const k = CARDS[(CARDS.indexOf(PANEL) + i) % CARDS.length];
    if(!hasCard(k)) continue;
    if(k !== PANEL){
      PANEL = k; LIST_PAGE = 0;                       // chosen now (data refreshes go to the new card)…
      const w = document.querySelector('.week');
      w.classList.add('swap');                        // …the old one fades out…
      clearTimeout(rotateCard.t);
      rotateCard.t = setTimeout(() => {
        renderPanel(true);                            // …then the new one comes in, row by row
        requestAnimationFrame(() => w.classList.remove('swap'));
      }, 380);
    }
    return;
  }
}

function renderPanel(animate){
  const ul = document.getElementById('week-list'), hd = document.getElementById('week-hd');
  const P = PANEL;
  let rows = [];
  if(P === 'prayers') rows = prayerRows();
  else if(P === 'forecast') rows = forecastRows();
  else if(P === 'matches') rows = matchRows();
  else if(P === 'verse'){ const q = quoteOfDay(); hd.textContent = q.title; rows = q.rows; }
  else if(P === 'adhkar'){ hd.textContent = ADHKAR_KIND ? ADHKAR[ADHKAR_KIND].title : ''; rows = adhkarRows(); }
  if(PANEL_TITLE[P]) hd.textContent = PANEL_TITLE[P];
  if(!rows.length){
    ul.classList.remove('flip');
    ul.innerHTML = `<li class="empty">${P === 'matches' ? 'لا مباريات هذا الأسبوع' : 'لا تتوفر بيانات الآن'}</li>`;
    return;
  }
  if(P === 'matches' && rows.length > WEEK_ROWS){        // page through, like the shows
    const start = (LIST_PAGE * WEEK_ROWS) % rows.length;
    rows = Array.from({length: WEEK_ROWS}, (_, i) => rows[(start + i) % rows.length]);
  }
  ul.innerHTML = rows.join('');
  ul.classList.remove('flip');
  if(animate){ void ul.offsetWidth; ul.classList.add('flip'); }
  glassSync();   // another card, another height: the card moved
}

function prayerRows(){
  if(!DAY_TIMES) return [];
  const p = riyadhParts(), now = p.h * 60 + p.mi;
  const names = {Fajr:'الفجر', Sunrise:'الشروق', Dhuhr:isFriday() ? 'الجمعة' : 'الظهر', Asr:'العصر', Maghrib:'المغرب', Isha:'العشاء'};
  let next = null;
  return Object.keys(names).filter(k => DAY_TIMES[k]).map(k => {
    const [h, mi] = String(DAY_TIMES[k]).split(':').map(Number);
    const at = h * 60 + mi;
    let cls = at < now ? 'past' : '';
    let cd = '';
    if(at >= now && !next){ next = k; cls = 'next'; cd = `<span class="cd" data-at="${at}">${countdownText(at)}</span>`; }
    return `<li class="pr ${cls}"><span>${names[k]}</span>${cd}<span class="dt">${fmt12(h, mi)}</span></li>`;
  });
}

/** «بعد ٠١:٢٣:٤٥» to `at` (minutes after midnight, the place's time) */
function countdownText(at){
  const p = riyadhParts();
  const left = Math.max(0, at * 60 - (p.h * 3600 + p.mi * 60 + p.s));
  const hh = Math.floor(left / 3600), mm = Math.floor(left % 3600 / 60), ss = left % 60;
  return 'بعد ' + ar(pad(hh) + ':' + pad(mm) + ':' + pad(ss));
}
/** every second: only the countdown's text changes (the row is redrawn when the prayer comes) */
function tickCountdown(){
  const el = document.querySelector('.week li.next .cd');
  if(!el) return;
  const at = +el.dataset.at, p = riyadhParts();
  if(p.h * 60 + p.mi >= at){ renderPanel(false); return; }   // its time: the next prayer moves on
  el.textContent = countdownText(at);
}

// Weather icons (drawn for this screen; soft and colourful). 24x24, each SVG carries its own gradients.
const WX_DEFS = '<defs>'
  + '<radialGradient id="wxg-sun" cx="40%" cy="38%" r="65%"><stop offset="0" stop-color="#FFE45C"/><stop offset="1" stop-color="#FFB020"/></radialGradient>'
  + '<linearGradient id="wxg-cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D5DCE6"/></linearGradient>'
  + '<linearGradient id="wxg-dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9D1DC"/><stop offset="1" stop-color="#8E99A8"/></linearGradient>'
  + '<linearGradient id="wxg-drop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FD8FF"/><stop offset="1" stop-color="#2F9BFF"/></linearGradient>'
  + '<linearGradient id="wxg-bolt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE45C"/><stop offset="1" stop-color="#FF9F0A"/></linearGradient>'
  + '</defs>';
const wxCloud = (dx, dy, s, fill) =>
  `<path fill="url(#wxg-${fill})" transform="translate(${dx} ${dy}) scale(${s})" d="M7 19h10.5a4 4 0 0 0 .6-7.95A5.5 5.5 0 0 0 7.6 9.6 3.75 3.75 0 0 0 7 19z"/>`;
const wxSun = (cx, cy, r) => {
  let rays = '';
  for(let i = 0; i < 8; i++){
    const a = i * Math.PI / 4, c = Math.cos(a), s = Math.sin(a);
    rays += `<line x1="${(cx + c * (r + 1.8)).toFixed(2)}" y1="${(cy + s * (r + 1.8)).toFixed(2)}" x2="${(cx + c * (r + 3.6)).toFixed(2)}" y2="${(cy + s * (r + 3.6)).toFixed(2)}"/>`;
  }
  return `<g stroke="#FFC233" stroke-width="1.6" stroke-linecap="round">${rays}</g><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#wxg-sun)"/>`;
};
const wxDrops = (xs, y, len) => xs.map(x => `<path d="M${x} ${y} q-1.1 ${len * .55} 0 ${len} q1.1 -${len * .45} 0 -${len}z" fill="url(#wxg-drop)"/>`).join('');
const wxFlakes = pts => '<g stroke="#E6F4FF" stroke-width="1.1" stroke-linecap="round">' + pts.map(([x, y]) =>
  `<line x1="${x}" y1="${y - 1.5}" x2="${x}" y2="${y + 1.5}"/><line x1="${x - 1.3}" y1="${y - .75}" x2="${x + 1.3}" y2="${y + .75}"/><line x1="${x + 1.3}" y1="${y - .75}" x2="${x - 1.3}" y2="${y + .75}"/>`).join('') + '</g>';
const wxSvg = body => `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${WX_DEFS}${body}</svg>`;
const WX_ICON_SVG = {
  clear:       wxSvg(wxSun(12, 12, 5)),
  mostlyClear: wxSvg(wxSun(10, 10, 4.6) + wxCloud(4.5, 4.5, .62, 'cloud')),
  partly:      wxSvg(wxSun(9, 8.5, 4) + wxCloud(1.5, 1.5, .9, 'cloud')),
  cloudy:      wxSvg(wxCloud(3.5, -3.2, .72, 'dark') + wxCloud(0, 0, 1, 'cloud')),
  fog:         wxSvg(wxCloud(0, -3, 1, 'cloud') + '<g stroke="#B9C3CF" stroke-width="1.6" stroke-linecap="round"><line x1="5" y1="18.5" x2="19" y2="18.5"/><line x1="7" y1="21.5" x2="17" y2="21.5"/></g>'),
  drizzle:     wxSvg(wxCloud(0, -4, 1, 'cloud') + wxDrops([8.5, 12.5, 16.5], 17, 3.2) + wxDrops([10.5, 14.5], 20.6, 2.6)),
  rain:        wxSvg(wxCloud(0, -4, 1, 'cloud') + wxDrops([8, 12, 16], 17, 4)),
  heavyRain:   wxSvg(wxCloud(0, -4, 1, 'dark') + wxDrops([7, 10.5, 14, 17.5], 16.5, 5)),
  snow:        wxSvg(wxCloud(0, -4, 1, 'cloud') + wxFlakes([[7.5, 18.2], [12, 20.6], [16.5, 18.2]])),
  thunder:     wxSvg(wxCloud(0, -4, 1, 'dark') + '<path d="M12.6 14.2 9.4 19h2.6l-1 4 4.2-5.6h-2.7l1.4-3.2z" fill="url(#wxg-bolt)"/>'),
};
/** WMO weather code (Open-Meteo) -> icon */
function wxIcon(code){
  const k = code === 0 ? 'clear' : code === 1 ? 'mostlyClear' : code === 2 ? 'partly' : code === 3 ? 'cloudy'
    : [45, 48].includes(code) ? 'fog' : [51, 53, 55, 56, 57].includes(code) ? 'drizzle'
    : [65, 67, 82].includes(code) ? 'heavyRain' : [61, 63, 66, 80, 81].includes(code) ? 'rain'
    : [71, 73, 75, 77, 85, 86].includes(code) ? 'snow' : [95, 96, 99].includes(code) ? 'thunder' : null;
  return k ? WX_ICON_SVG[k] : '';
}

function forecastRows(){
  return FORECAST.slice(0, 5).map((d, i) => {
    const day = i === 0 ? 'اليوم' : i === 1 ? 'غداً'
      : new Intl.DateTimeFormat(GREG, {timeZone:'UTC', weekday:'long'}).format(new Date(d.date + 'T12:00:00Z'));
    // the condition and its icon after it, together in the middle of the row
    return `<li class="fc"><span>${day}</span><span class="wx">${WX_CODES[d.code] || ''}<i>${wxIcon(d.code)}</i></span>`
         + `<span class="dt">${ar(Math.round(d.hi))}° / ${ar(Math.round(d.lo))}°</span></li>`;
  });
}

// every followed team's games this week, plus results from the last day, in time order
/** «اليوم», «غداً», else «الأحد ٢٥ أكتوبر»: the date too, so the games read in order however far apart */
function matchDay(d){
  const key = x => new Intl.DateTimeFormat('en-CA', {timeZone:CONFIG.timezone}).format(x);
  if(key(d) === key(new Date())) return 'اليوم';
  if(key(d) === key(new Date(Date.now() + 86400000))) return 'غداً';
  return new Intl.DateTimeFormat(GREG, {timeZone:CONFIG.timezone, weekday:'long', day:'numeric', month:'long'})
    .format(d).replace('،', '');
}

function matchRows(){
  const now = Date.now(), seen = new Set(), evs = [];
  CONFIG.teamIds.forEach(id => {
    const next = NEXT_LIST[id] || (MATCHES[id] ? [MATCHES[id]] : []);
    next.forEach(ev => { if(ev && ev.idEvent && !seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(MATCHES[id] && MATCHES[id].idEvent === ev.idEvent ? MATCHES[id] : ev); } });
    resultsFor(id).forEach(ev => { if(!seen.has(ev.idEvent)){ seen.add(ev.idEvent); evs.push(ev); } });
  });
  // the next five (and one in progress), however far ahead; the last result has its place at the bottom
  return evs.map(ev => ({ev, t: toDate(ev).getTime()}))
    .filter(x => !finishedRecently(x.ev, now)
      && now < x.t + 2.5*3600000 && !FINAL.includes((x.ev.strStatus || '').toUpperCase()))
    .sort((a, b) => a.t - b.t)
    .slice(0, 5)
    .map(({ev, t}) => {
      const d = new Date(t), scored = ev.intHomeScore != null && ev.intAwayScore != null;
      const mid = scored && now >= t ? ` <span class="sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span> ` : ' × ';
      const p = new Intl.DateTimeFormat('en-GB', {timeZone:CONFIG.timezone, hour:'2-digit', minute:'2-digit', hour12:false})
        .formatToParts(d).reduce((a, x) => (a[x.type] = x.value, a), {});
      const when = finishedRecently(ev, now) ? 'انتهت'
        : now >= t && !ev.timeTbc ? '<span class="live">مباشر</span>'
        : matchDay(d) + ' · ' + (ev.timeTbc ? 'الوقت لم يُحدد' : fmt12(+p.hour % 24, +p.minute));
      return `<li><span>${esc(teamAr(ev.strHomeTeam, ev.idHomeTeam))}${mid}${esc(teamAr(ev.strAwayTeam, ev.idAwayTeam))}</span><span class="dt">${when}</span></li>`;
    });
}

// verse one day, hadith the next. Verse texts come from the Quran API via CI (.github/tools/fetch_verses.py), never typed.
const VERSES = __VERSES__;   // assets/shared/verses.json
// hadith: only those .github/tools/verify_hadith.py found in the six books, each shown in full as the book has it,
// isnad and all: parts are ["n", narration] and ["q", the Prophet's words]; source is the book and its number
const HADITH = __HADITH__;   // assets/shared/hadith.json, through src/build.py
function quoteOfDay(){
  const n = riyadhDayNumber(), half = Math.floor(n / 2);
  if(VERSES.length && n % 2 === 0){
    const v = VERSES[half % VERSES.length];
    return {title:'آية اليوم', rows:[`<li class="quote"><span class="orn">﴿</span>${esc(v.text)}<span class="orn">﴾</span></li>`, `<li class="src">${esc(v.surah)} · ${ar(v.ayah)}</li>`]};
  }
  const h = HADITH[half % HADITH.length];
  const saw = s => s.replace(/ﷺ/g, '<span class="saw">ﷺ</span>').replace(/[﴿﴾]/g, m => `<span class="orn">${m}</span>`);
  const body = h.parts.map(([k, t]) => k === 'q' ? `«${saw(esc(t))}»` : `<span class="nar">${saw(esc(t))}</span>`).join(' ');
  return {title:'حديث اليوم', rows:[`<li class="quote hadith">${body}</li>`, `<li class="src">${esc(h.source)}</li>`]};
}

const WX_CODES = {
  0:'صافي',1:'صافي غالباً',2:'غائم جزئياً',3:'غائم',45:'ضباب',48:'ضباب متجمد',
  51:'رذاذ',53:'رذاذ',55:'رذاذ كثيف',56:'رذاذ متجمد',57:'رذاذ متجمد',
  61:'مطر خفيف',63:'مطر',65:'مطر غزير',66:'مطر متجمد',67:'مطر متجمد',
  71:'ثلج خفيف',73:'ثلج',75:'ثلج كثيف',77:'حبيبات ثلج',
  80:'زخات خفيفة',81:'زخات مطر',82:'زخات غزيرة',85:'زخات ثلج',86:'زخات ثلج',
  95:'عواصف رعدية',96:'عواصف مصحوبة ببرد',99:'عواصف قوية'
};
async function loadWeather(){
  const q = `latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}&timezone=${encodeURIComponent(CONFIG.timezone)}`;
  try{
    const r = await fetchT(`https://api.open-meteo.com/v1/forecast?${q}&current=temperature_2m,weather_code`
                         + `&daily=temperature_2m_max,temperature_2m_min,weather_code&forecast_days=5`, 12000);
    if(!r.ok) throw 0;
    const j = await r.json();
    document.getElementById('wx-temp').textContent = ar(Math.round(j.current.temperature_2m)) + '°';
    const d = document.getElementById('wx-desc');
    d.textContent = WX_CODES[j.current.weather_code] || '';
    d.classList.remove('dust');
    const hi = j.daily?.temperature_2m_max?.[0], lo = j.daily?.temperature_2m_min?.[0];
    document.getElementById('wx-range').textContent =
      (hi != null && lo != null) ? `${ar(Math.round(hi))}° / ${ar(Math.round(lo))}°` : '';
    const dl = j.daily || {};
    FORECAST = (dl.time || []).map((t, i) => ({date:t, code:dl.weather_code?.[i],
      hi:dl.temperature_2m_max?.[i], lo:dl.temperature_2m_min?.[i]})).filter(x => x.hi != null && x.lo != null);
    try{ localStorage.setItem('forecast:' + location.hash, JSON.stringify(FORECAST)); }catch(e){}
    if(PANEL === 'forecast') renderPanel(false);
  }catch(e){ return; }   // keep the last reading; with none only the city shows

  // dust overrides the condition word: PM10 in µg/m³
  try{
    const r = await fetchT(`https://air-quality-api.open-meteo.com/v1/air-quality?${q}&current=pm10,dust`, 12000);
    if(!r.ok) throw 0;
    const c = (await r.json()).current || {};
    const pm = Math.max(c.pm10 || 0, c.dust || 0);
    if(pm >= 150){
      const d = document.getElementById('wx-desc');
      d.textContent = pm >= 400 ? 'غبار كثيف' : 'غبار';
      d.classList.add('dust');
    }
  }catch(e){}
}

// night dimming: transparent by day, dark after 21:00 and before 07:00
function applyNight(){
  if(!CONFIG.nightDim){ const el = document.getElementById('dimmer'); if(el) el.style.opacity = '0'; return; }
  const p = riyadhParts();
  const h = p.h + p.mi/60;
  const MAX = 0.46;
  let o = 0;
  if(h >= 23 || h < 5)      o = MAX;
  else if(h >= 21)          o = MAX * (h - 21) / 2;
  else if(h < 7)            o = MAX * (7 - h) / 2;
  const el = document.getElementById('dimmer');
  if(el) el.style.opacity = Math.max(0, Math.min(MAX, o)).toFixed(2);
}

// gentle pixel shift so static text never burns into the panel
const SHIFT_SEQ = [[0,0],[3,2],[0,4],[-3,2],[-3,-2],[0,-4],[3,-2]];
let shiftTick = 0;
function pixelShift(){
  shiftTick = (shiftTick + 1) % SHIFT_SEQ.length;
  const [dx,dy] = SHIFT_SEQ[shiftTick];
  const st = document.querySelector('.stage');
  if(st) st.style.transform = `translate(${dx}px,${dy}px)`;
}

// Background photos: the hosted set in photos/ (photos/index.json in the repo). A hosted photo is used only
// once it has loaded; offline, or if it fails, a bundled one is shown, so the screen is never empty.
const PHOTO_BASE = 'https://raw.githubusercontent.com/abdosamo1/UrTV/master/photos/';
let REMOTE_BGS = (()=>{ try{ return JSON.parse(localStorage.getItem('photoIndex') || '[]'); }catch(e){ return []; } })();

async function loadPhotoIndex(){
  try{
    const r = await fetchT(PHOTO_BASE + 'index.json', 15000);
    if(!r.ok) return;
    const list = (await r.json()).filter(p => p && p.f);
    if(list.length){
      REMOTE_BGS = list;
      try{ localStorage.setItem('photoIndex', JSON.stringify(list)); }catch(e){}
    }
  }catch(e){}
}

let REVEALED = false;
function reveal(){
  if(REVEALED) return;
  REVEALED = true;
  // fonts may still be arriving (tv.html loads them as files): wait for them, briefly
  const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([fonts, new Promise(r => setTimeout(r, 800))])
    .then(() => document.documentElement.classList.add('ready'));
}

function showBackground(url, b){
  const ph = document.querySelector('.photo');
  reveal();
  if(!ph) return;
  const next = "url('" + url + "')";
  if(ph.style.backgroundImage === next) return;   // same photo: no reload, no new movement
  ph.style.backgroundImage = next;
  document.documentElement.style.setProperty('--photo', next);   // the card's frosted glass shows this photo
  glassSync();
  ph.style.setProperty('--dim', (1 - (b.d || 0.95)).toFixed(2));
  ph.classList.remove('settle'); void ph.offsetWidth; ph.classList.add('settle');
  const cr = document.getElementById('credit');
  if(cr) cr.textContent = b.c ? 'الصورة: ' + b.c : '';
}

/** Line the card's frosted photo up with the photo on screen (the photo fills the screen, like cover). */
function glassSync(){
  const w = document.querySelector('.week');
  if(!w || CONFIG.widget) return;
  const r = w.getBoundingClientRect(), s = w.style;
  s.setProperty('--bgw', innerWidth + 'px');
  s.setProperty('--bgh', innerHeight + 'px');
  s.setProperty('--bgx', (40 - r.left) + 'px');   // ::before reaches 40px past the card on each side
  s.setProperty('--bgy', (40 - r.top) + 'px');
}
addEventListener('resize', glassSync);

// Every 4 days a new random set of 5 hosted photos (same draw as the launcher: Park-Miller generator seeded
// by the 4-day period), rotating every CONFIG.photoMinutes (30 unless the owner changed it). Only the photo on screen is downloaded.
const PHOTO_SET = 5, PHOTO_PERIOD_DAYS = 4;
function riyadhDayNumber(){
  const p = riyadhParts();
  return Math.floor(Date.UTC(p.y, p.mo - 1, p.d) / 86400000);
}
function photoSet(n){
  const period = Math.floor(riyadhDayNumber() / PHOTO_PERIOD_DAYS);
  let seed = (period % 2147483646) + 1;
  const pick = [];
  for(let guard = 0; pick.length < Math.min(PHOTO_SET, n) && guard < 1000; guard++){
    seed = (seed * 48271) % 2147483647;
    const k = seed % n;
    if(!pick.includes(k)) pick.push(k);
  }
  return pick;
}
let BG_SLOT = -1, PREFETCHED = false;
function applyBackground(force){
  try {
    const p = riyadhParts();
    const slotMin = CONFIG.photoMinutes;   // divides 1440, so slots count on across midnight
    const slot = riyadhDayNumber() * (1440 / slotMin) + Math.floor((p.h * 60 + p.mi) / slotMin);
    if(slot === BG_SLOT && !force) return;
    BG_SLOT = slot;
    const set = REMOTE_BGS.length ? photoSet(REMOTE_BGS.length).map(k => REMOTE_BGS[k]) : [];
    const local = BGS[slot % BGS.length];
    if(!set.length){ showBackground(local.u, local); return; }
    const b = set[slot % set.length], url = PHOTO_BASE + b.f;
    // First photo: wait briefly for the hosted one (the app serves it from disk at once) so the screen
    // doesn't flash a bundled photo first; slow network → bundled one, swapped when the hosted one arrives.
    let done = false;
    const fallback = () => { if(!done && !document.querySelector('.photo').style.backgroundImage) showBackground(local.u, local); };
    const t = setTimeout(fallback, 1200);
    const img = new Image();
    img.onload = () => { done = true; clearTimeout(t); showBackground(url, b); };
    img.onerror = () => { clearTimeout(t); fallback(); done = true; };
    img.src = url;
    // fetch the rest of the set once, quietly, so the app has each one on disk before its turn
    if(!PREFETCHED){ PREFETCHED = true; setTimeout(() => set.forEach(x => { new Image().src = PHOTO_BASE + x.f; }), 20000); }
  } catch(e) {}
}

// Last painted panels, shown at once on the next start while fresh data loads.
const SNAP_KEY = 'snap5:' + location.hash;   // bump when the panels' markup changes
const SNAP_SEL = ['.markets', '#match-row'];   // the card beside the clock redraws at once from local data
function saveSnap(){
  try{ localStorage.setItem(SNAP_KEY, JSON.stringify(SNAP_SEL.map(q => (document.querySelector(q)||{}).innerHTML || ''))); }catch(e){}
}
function restoreSnap(){
  try{
    const v = JSON.parse(localStorage.getItem(SNAP_KEY) || 'null');
    if(v) SNAP_SEL.forEach((q, i) => { const el = document.querySelector(q); if(el && v[i]) el.innerHTML = v[i]; });
  }catch(e){}
}

function showCity(){
  const wxCity = document.getElementById('wx-city');
  if(wxCity){ wxCity.textContent = CONFIG.city; wxCity.dir = 'auto'; }   // «Stuttgart, Deutschland» reads left to right
  const cs = document.getElementById('clock-sub');
  // the line is letter-spaced for Arabic; a Latin name keeps its normal spacing
  const name = CONFIG.city.split(', ')[0];
  if(cs) cs.innerHTML = 'بتوقيت ' + (/[A-Za-z]/.test(name) ? `<bdi style="letter-spacing:0">${esc(name)}</bdi>` : esc(name));
}

function boot(){
  if(CONFIG.widget){ bootWidget(); return; }
  restoreSnap();
  setTimeout(saveSnap, 15*1000);   // the dream can be killed before pagehide
  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);
  showCity();
  if(CONFIG.autoLocation){
    const relocate = force => locate(force).then(changed => {
      if(!changed) return;
      showCity(); tickClock.last = null; tickClock(); tickDates(); applyNight();
      loadWeather(); loadPrayers();
    });
    relocate(false);
    setInterval(() => relocate(true), GEO_MAX_AGE);
  }
  document.title = 'شاشة تلفزيونك';
  applyBackground(true);
  loadPhotoIndex().then(() => applyBackground(true));
  setInterval(() => applyBackground(false), 60*1000);
  tickClock(); tickDates(); tickRamadan(); renderMatches(false);
  if(CONFIG.panel === 'none') document.querySelector('.week').style.display = 'none';
  else renderPanel(false);   // its own data arrives with prayers, weather, matches
  loadPrayers(); loadMatches(); loadWeather();
  applyNight(); pixelShift();

  setInterval(tickClock, 1000);
  setInterval(tickCountdown, 1000);
  setInterval(()=>{ tickDates(); tickPrayer(); tickRamadan(); if(PANEL === 'prayers') renderPanel(false); }, 15000);
  setInterval(rotateCard, ROTATE_MS);
  tickAdhkar(); setInterval(tickAdhkar, 3000);
  setInterval(() => renderMatches(false), 60000);
  setInterval(() => renderMatches(true), CONFIG.matchPageMs);
  setInterval(loadLive, 2*60000);
  setInterval(loadPrayers, 6*3600*1000);
  setInterval(loadMatches, 30*60*1000);
  setInterval(loadWeather, 30*60*1000);
  setInterval(()=>{
    if(PANEL === 'matches'){ LIST_PAGE++; renderPanel(matchRows().length > WEEK_ROWS); }
  }, 25*1000);
  setInterval(applyNight, 60*1000);
  setInterval(pixelShift, 4*60*1000);
  let lastDay = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
  setInterval(()=>{
    const d = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
    if(d !== lastDay){ lastDay = d; loadPhotoIndex().then(() => applyBackground(true)); tickDates(); tickRamadan(); loadPrayers(); loadMatches(); loadWeather(); renderPanel(false); }
  }, 60*1000);
}

/** The home screen's card asks for this: the card at most `max` px tall (zoomed down if it is longer, so it never
 *  covers the app name under it); returns the height it now takes. */
function fitCard(max){
  const w = document.querySelector('.week'), root = document.documentElement;
  if(!w) return 0;
  root.style.zoom = 1;
  const natural = w.getBoundingClientRect().height;
  const z = max > 0 && natural > max ? max / natural : 1;
  root.style.zoom = z;
  return Math.ceil(natural * z);
}

// The launcher's card: the chosen panel only (or the four in turn), refreshed like on the screensaver.
function bootWidget(){
  document.documentElement.classList.add('widget');
  restoreSnap();
  setTimeout(saveSnap, 15*1000);
  setInterval(saveSnap, 60*1000);
  addEventListener('pagehide', saveSnap);
  if(CONFIG.autoLocation && (wants('prayers') || wants('forecast')))
    locate(false).then(changed => { if(changed){ if(wants('prayers')) loadPrayers(); if(wants('forecast')) loadWeather(); } });
  renderPanel(false);
  if(wants('prayers') || CONFIG.adhkar){ loadPrayers(); setInterval(loadPrayers, 6*3600*1000); }   // the adhkar start at Fajr
  if(wants('prayers')) setInterval(() => { if(PANEL === 'prayers') renderPanel(false); }, 15000);
  if(CONFIG.panel === 'none') document.querySelector('.week').style.display = 'none';
  tickAdhkar(); setInterval(tickAdhkar, 3000);
  if(wants('forecast')){ loadWeather(); setInterval(loadWeather, 30*60*1000); }
  if(wants('matches')){ loadMatches(); setInterval(loadMatches, 30*60*1000); setInterval(loadLive, 2*60000); }
  setInterval(rotateCard, ROTATE_MS);
  setInterval(tickCountdown, 1000);
  setInterval(() => {
    if(PANEL === 'matches'){ LIST_PAGE++; renderPanel(matchRows().length > WEEK_ROWS); }
  }, 25*1000);
  let lastDay = riyadhDayNumber();
  setInterval(() => { if(riyadhDayNumber() !== lastDay){ lastDay = riyadhDayNumber(); if(wants('prayers')) loadPrayers(); renderPanel(false); } }, 60*1000);
  reveal();
}

document.addEventListener('keydown', e=>{
  if(e.key === 'f' || e.key === 'F'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen().catch(()=>{});
  }
});

boot();
</script>
