<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شاشة تلفزيونك</title>
<style>
  @font-face{font-family:'Thmanyah';font-weight:300;font-style:normal;font-display:block;src:url("__F_LIGHT__") format("woff2")}
  @font-face{font-family:'Thmanyah';font-weight:400;font-style:normal;font-display:block;src:url("__F_REGULAR__") format("woff2")}
  @font-face{font-family:'Thmanyah';font-weight:500;font-style:normal;font-display:block;src:url("__F_MEDIUM__") format("woff2")}
  /* ﷺ and ﴿﴾ only (2 KB subset of Noto Naskh Arabic, OFL): Thmanyah has no glyph for them */
  @font-face{font-family:'NotoMarks';font-style:normal;font-weight:400;src:url("__F_MARKS__") format("woff2")}
  @font-face{font-family:'ThmanyahDisplay';font-weight:700;font-style:normal;font-display:block;src:url("__F_DISPLAY__") format("woff2")}

  :root{
    --sand:#F6EFE0;
    --dim:#C3B8A2;
    --gold:#DCB86F;
    --green-lt:#57D294;
    --red:#EE6A50;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  /* Hidden until the clock, the saved panels and the photo are in place, then one fade in: no half-built
     frames. The delayed animation shows it anyway if the script ever fails. */
  body{opacity:0;animation:reveal .3s 2.5s forwards}
  html.ready body{opacity:1;animation:none;transition:opacity .3s ease}
  @keyframes reveal{to{opacity:1}}
  /* card-only mode for the launcher */
  html.widget,html.widget body{background:transparent}
  html.widget .photo,html.widget .veil,html.widget .grain,html.widget .top-veil,html.widget .bottom-veil,
  html.widget .dimmer,html.widget #credit,html.widget .top,html.widget .clockwrap,html.widget .bottom{display:none}
  html.widget .stage{height:auto;padding:0;display:block;transition:none}
  html.widget .mid{display:block}
  html.widget .week{width:100%;background:transparent;border:none;box-shadow:none;border-radius:0}
  html.widget .week::before,html.widget .week::after{display:none}   /* on the home screen the app draws the glass */
  html.widget .week{padding:0}
  html.widget .week .hd{margin-bottom:8px}
  html.widget .week li,html.widget .week li.pr{padding:6px 0}
  html.widget .week li.src{padding:4px 0 0}
  html,body{
    height:100%;overflow:hidden;background:#040E09;color:var(--sand);
    font-family:'Thmanyah',system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;cursor:none;
  }

  .photo{
    position:fixed;inset:0;z-index:0;
    background-image:none;
    background-color:#040E09;
    background-size:cover;
    background-position:center 26%;
    background-repeat:no-repeat;
    transform:scale(1.03);   /* edges stay covered while it settles */
  }
  /* each photo's darkness as a plain black layer: same look as filter:brightness, nothing to recompute */
  .photo::after{content:'';position:absolute;inset:0;background:#000;opacity:var(--dim,.05)}
  .veil{
    position:fixed;inset:0;z-index:1;
    background:
      linear-gradient(180deg,rgba(3,10,7,.62) 0%,rgba(3,10,7,.30) 22%,rgba(3,10,7,.12) 46%,rgba(3,10,7,.42) 74%,rgba(2,6,4,.88) 100%),
      radial-gradient(120% 85% at 22% 34%,rgba(3,14,9,.42) 0%,rgba(3,14,9,0) 58%);
  }
  /* photo credits live in PHOTO-CREDITS.md on GitHub, not on screen */
  #credit{display:none;
    position:fixed;left:26px;bottom:6px;z-index:4;
    font-size:10px;letter-spacing:.02em;
    color:rgba(246,239,224,.30);pointer-events:none;
  }
  .grain{
    position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.55'/></svg>");
  }
  .top-veil{
    position:fixed;left:0;top:0;width:56vw;height:34vh;z-index:3;pointer-events:none;
    background:radial-gradient(120% 100% at 0% 0%,rgba(2,9,6,.82) 0%,rgba(2,9,6,.42) 45%,rgba(2,9,6,0) 76%);
  }
  .bottom-veil{
    position:fixed;left:0;right:0;bottom:0;height:30vh;z-index:3;pointer-events:none;
    background:linear-gradient(180deg,rgba(2,7,4,0) 0%,rgba(2,7,4,.55) 42%,rgba(2,6,4,.86) 100%);
  }

  .stage{
    position:relative;z-index:5;height:100vh;
    padding:3.1vh 3.6vw 5.4vh;
    display:grid;grid-template-rows:auto 1fr auto;gap:1.5vh;
  }

  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:2.5vw}

  .up{color:var(--green-lt)}.down{color:var(--red)}

  .week{
    width:min(760px,48vw);justify-self:end;
    position:relative;isolation:isolate;overflow:hidden;
    /* glass, as on iOS: the frosted photo (::before), a light tint brighter at the top, a rim that catches the
       light on the top edge and again at the bottom, and a soft shadow */
    background:linear-gradient(165deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 42%,rgba(255,255,255,.03) 70%,rgba(255,255,255,.09));
    border:1px solid rgba(255,255,255,.20);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(255,255,255,.12),
               inset 1px 0 0 rgba(255,255,255,.10),0 18px 48px rgba(0,0,0,.38);
    border-radius:24px;
    padding:1.9vh 1.6vw;
  }
  /* the photo behind the card, blurred: drawn once (no backdrop-filter, which a TV redoes every frame over the
     moving photo); glassSync() lines it up with the photo on screen */
  .week::before{
    content:'';position:absolute;inset:-40px;z-index:-1;pointer-events:none;
    background-image:var(--photo,none);background-size:var(--bgw,100vw) var(--bgh,100vh);
    background-position:var(--bgx,0) var(--bgy,0);background-repeat:no-repeat;
    filter:blur(26px) saturate(1.45) brightness(.58);
  }
  .week::after{   /* the gloss on the upper part */
    content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0) 38%);
  }
  .week .hd{
    display:flex;align-items:center;gap:.7em;margin-bottom:1vh;
    font-size:clamp(12px,1vw,18px);font-weight:500;letter-spacing:.18em;color:#D6AF6B;
  }
  .week .hd::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(220,184,111,.5),transparent)}
  .week ul{list-style:none;display:flex;flex-direction:column;gap:0}
  .week li{
    display:flex;align-items:baseline;gap:1.05em;
    font-size:clamp(14px,1.16vw,22px);font-weight:400;color:#F6EEDC;
    white-space:nowrap;line-height:1.3;
    padding:.8vh 0;border-bottom:1px solid rgba(220,184,111,.13);
  }
  .week li:last-child{border-bottom:none}
  .week li span:first-child{flex:0 1 auto;max-width:68%;overflow:hidden;text-overflow:ellipsis;padding-bottom:.3em;margin-bottom:-.3em}
  .week li .ep{flex:0 0 auto;color:#9FB8A8;font-size:.74em;font-variant-numeric:tabular-nums}
  .week li .rt{flex:0 0 auto;color:#E0BA74;font-size:.74em;font-variant-numeric:tabular-nums}
  .week li .dt{flex:1 1 auto;color:#9C9279;font-size:.72em;min-width:3.2em;text-align:left}
  .week ul.flip li{animation:weekIn .5s ease both}
  .week ul.flip li:nth-child(2){animation-delay:.06s}
  .week ul.flip li:nth-child(3){animation-delay:.12s}
  .week ul.flip li:nth-child(4){animation-delay:.18s}
  .week ul.flip li:nth-child(5){animation-delay:.24s}
  @keyframes weekIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* the card changing content (the cards in turn): the old one fades and lifts away, the new one comes in */
  .week .hd,.week ul{transition:opacity .38s ease,transform .38s ease,filter .38s ease}
  .week.swap .hd,.week.swap ul{opacity:0;transform:translateY(-10px) scale(.985);filter:blur(3px)}
  .week li.past{color:#8F8670}
  .week li.next{color:#FFE9B8}
  .week li.next .dt{color:#E0BA74}
  /* every word on the card outlined in black, so it reads on light glass and bright photos */
  .week{text-shadow:-1px 0 0 #000,1px 0 0 #000,0 -1px 0 #000,0 1px 0 #000,0 2px 6px rgba(0,0,0,.55)}
  /* the prayer card: bigger rows, times as ٠١:٠٣, the next prayer's countdown between its name and its time */
  .week li.pr{font-size:clamp(20px,1.6vw,31px);font-weight:500;padding:.95vh 0}
  .week li.pr .dt{flex:1 1 auto;font-size:.9em;color:#E9DFC8;font-variant-numeric:tabular-nums}
  .week li.pr.past{color:#C8BEA6}
  .week li.pr.past .dt{color:#C8BEA6}
  .week li.pr.next .cd{flex:1 1 auto;text-align:center;font-size:.78em;color:#F1CF8A;font-variant-numeric:tabular-nums}
  .week li.pr.next .dt{flex:0 0 auto;color:#FFE9B8}
  /* the weather card: as big as the prayer rows; the condition and its icon centred */
  .week li.fc{font-size:clamp(20px,1.6vw,31px);font-weight:500;padding:.95vh 0;align-items:center}
  .week li.fc span:first-child{flex:0 0 4.6em}
  .week li.fc .wx{flex:1 1 auto;display:flex;justify-content:center;align-items:center;gap:.4em;font-size:.86em;color:#E9DFC8}
  .week li.fc .wx i{display:block;width:1.5em;height:1.5em;flex:0 0 auto}
  .week li.fc .wx svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  .week li.fc .dt{flex:0 0 auto;font-size:.9em;color:#E9DFC8}
  html.widget .week li.fc{padding:6px 0}
  .week li.quote{white-space:normal;display:block;font-size:clamp(17px,1.5vw,29px);line-height:1.75;
    border-bottom:none;padding:.4vh 0 0;color:#FFF7E6}
  /* Thmanyah draws ﴿﴾ as small angle marks: they come from the NotoMarks subset */
  .week li.quote .orn{font-family:'NotoMarks','Noto Naskh Arabic',serif;color:#D6AF6B;
    font-size:1.05em;padding:0 .15em}
  /* ﷺ is not in Thmanyah either: NotoMarks, in gold like the verse brackets so it reads as ornament */
  .week li.quote .saw{font-family:'NotoMarks','Noto Naskh Arabic',serif;color:#D6AF6B;font-size:1.6em;line-height:1;vertical-align:-.1em}
  /* a full hadith: the isnad and the narration small and muted, the Prophet's words ﷺ at full size */
  .week li.quote.hadith{font-size:clamp(15px,1.3vw,25px);line-height:1.7}
  .week li.quote .nar{font-size:.66em;color:#B9AE96}
  .week li.quote .nar .saw{font-size:1.45em}
  .week li.src{border-bottom:none;padding:.6vh 0 0;font-size:clamp(12px,.95vw,18px);color:#D6AF6B}
  /* the adhkar: one at a time; a long one in a smaller size so it fits the card */
  .week li.quote.dk.long{font-size:clamp(14px,1.2vw,23px);line-height:1.65}
  .week li.quote.dk.xlong{font-size:clamp(12px,1.02vw,20px);line-height:1.6}
  .week li.quote .vn{font-size:.62em;color:#D6AF6B}
  .week .empty{color:#9A9078;font-size:clamp(14px,1.1vw,21px);font-weight:300;margin-top:1vh}

  .dates{text-align:right;flex-shrink:0}
  .hijri{font-size:clamp(19px,1.86vw,37px);font-weight:500;color:var(--sand);line-height:1.3}
  .greg{margin-top:.55vh;font-size:clamp(12px,1.06vw,21px);font-weight:300;color:var(--dim)}
  /* starts at the screen edge, under the first letters, and fades toward the middle */
  .rule{margin-top:1.2vh;width:clamp(100px,9vw,190px);height:1px;margin-left:auto;margin-right:0;
    background:linear-gradient(270deg,var(--gold),rgba(220,184,111,0))}

  /* the card keeps its width on the left; the clock is centred in the space between it and the right edge */
  .mid{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4.5vw}
  .clockwrap{display:flex;flex-direction:column;align-items:center;justify-self:center}
  .clock{
    display:flex;align-items:baseline;justify-content:center;direction:ltr;
    font-family:'ThmanyahDisplay','Thmanyah',serif;
    font-weight:700;
    font-size:clamp(120px,min(17vw,31vh),345px);line-height:.92;letter-spacing:.022em;
    color:#FFFDF6;font-variant-numeric:tabular-nums;
    text-shadow:0 4px 70px rgba(0,0,0,.65), 0 0 130px rgba(255,236,190,.12);
  }
  .clock .d{unicode-bidi:isolate}
  .clock .d i{font-style:normal}
  .clock .d i + i{margin-left:var(--digit-gap,.09em)}
  .clock .sep{
    font-size:.46em;align-self:center;transform:translateY(-.08em);color:var(--gold);opacity:.9;padding:0 .1em;
  }
  .clock .ampm{
    font-size:.28em;font-weight:500;color:var(--gold);
    align-self:flex-start;margin-top:.12em;margin-inline-end:.25em;
  }
  .subline{
    margin-top:1.4vh;display:flex;align-items:center;gap:.7em;
    font-size:clamp(12px,1.02vw,20px);font-weight:300;letter-spacing:.3em;color:#D8CDB6;
  }
  .subline .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.9}

  .bottom{
    display:grid;grid-template-columns:1fr .9fr 1.3fr;
    gap:2.4vw;align-items:start;
    border-top:1px solid rgba(220,184,111,.30);
    padding-top:2.1vh;
  }
  .panel{min-width:0}
  .panel .label{
    font-size:clamp(12px,.98vw,18px);font-weight:500;letter-spacing:.2em;
    color:#D6AF6B;margin-bottom:.8vh;white-space:nowrap;
  }
  .panel .big{
    display:flex;align-items:baseline;gap:.4em;flex-wrap:nowrap;white-space:nowrap;min-width:0;line-height:1.1;
    font-weight:700;font-family:'ThmanyahDisplay','Thmanyah',serif;font-size:clamp(22px,2vw,42px);color:var(--sand);
  }
  .panel .num{color:#FFFCF2;font-size:1.12em;font-variant-numeric:tabular-nums;font-weight:500}
  .panel .unit{font-size:.56em;font-weight:500;color:var(--gold)}
  .panel .sub{
    margin-top:.85vh;font-size:clamp(12px,1vw,19px);font-weight:300;color:#C6BBA4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:.3em;margin-bottom:-.3em;
  }
  .panel .sub b{color:#F0E6D0;font-weight:500}

  .p-prayer{text-align:right}
  .p-prayer .big{justify-content:flex-start}
  .p-mid{text-align:center}
  .p-mid .big{display:block;text-align:center;line-height:1.06}
  .p-mid .num{font-size:1.3em;line-height:1}
  .p-mid .unit{font-size:.46em;font-weight:500;color:#D6AF6B;letter-spacing:.02em;display:inline;vertical-align:.5em}
  .p-match{text-align:left}
  .p-match .big{justify-content:flex-end}
  .p-match .sub{white-space:normal;line-height:1.4;max-width:100%;font-size:clamp(11px,.88vw,17px)}

  .mrow{display:flex;flex-direction:row;gap:1.6vw;align-items:flex-end;justify-content:flex-end;min-width:0}
  .mblock{text-align:left;flex:0 1 auto;min-width:0;max-width:100%}
  .mblock:not(:last-child){padding-inline-end:1.6vw;border-inline-end:1px solid rgba(220,184,111,.25)}
  .mrow:has(.mblock + .mblock) .big{font-size:clamp(18px,1.6vw,34px)}
  .mblock .big{justify-content:flex-end;min-width:0}
  .mrow.flip .mblock{animation:weekIn .5s ease both}
  .mrow.flip .mblock + .mblock{animation-delay:.08s}
  .mblock .big > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;
    padding-bottom:.3em;margin-bottom:-.3em}  /* room for the dots under ي, ج… */
  .none-week{font-size:clamp(26px,2.5vw,54px);font-weight:700;font-family:'ThmanyahDisplay','Thmanyah',serif;color:#A79C85}

  /* A new photo settles in over a minute, then holds still: an endless drift kept the TV redrawing
     the whole screen 60 times a second, for hours. */
  @keyframes settle{
    from{transform:scale(1.055) translate3d(-.55%,-.4%,0)}
    to{transform:scale(1.03) translate3d(0,0,0)}
  }
  @media (prefers-reduced-motion:no-preference){.photo.settle{animation:settle 60s ease-out both}}

  /* ===== top left: weather, set like the date block on the right (no boxes) ===== */
  .markets{text-align:left;flex-shrink:0}
  .wxline{display:flex;align-items:baseline;gap:.5em;justify-content:flex-end;line-height:1.3;
    font-size:clamp(19px,1.86vw,37px);font-weight:500;color:var(--sand)}
  .wxt{font-family:'ThmanyahDisplay','Thmanyah',serif;font-weight:700;color:#FFFCF2;direction:ltr;
    font-variant-numeric:tabular-nums}
  .wxd.dust{color:#E8B86A}
  .wxsub{margin-top:.55vh;font-size:clamp(12px,1.06vw,21px);font-weight:300;color:var(--dim);white-space:nowrap}
  .wxr:not(:empty)::before{content:'  ·  ';white-space:pre;color:rgba(214,175,107,.7)}
  .wxt:empty,.wxd:empty,.wxr:empty{display:none}
  .rule.l{margin-left:0;margin-right:auto;background:linear-gradient(90deg,var(--gold),rgba(220,184,111,0))}
  .p-prayer.now .big{color:#FFE9B8;text-shadow:0 0 40px rgba(220,184,111,.45)}
  .p-prayer.now .label{color:#F1CF8A}
  .live{color:#EE8B70;font-weight:500}
  .dimmer{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:30;transition:opacity 6s linear}
  .stage{transition:transform 3s ease}
  .sc{color:#E0BA74;letter-spacing:.02em}

  @media (max-aspect-ratio:5/4){
    .top{flex-direction:column-reverse;gap:1.4vh}
    .bottom{grid-template-columns:1fr 1fr}
    .p-match{grid-column:1/-1;text-align:right}
    .mrow{align-items:flex-start}
  }
</style>
</head>
<body>
<div class="photo"></div>
<div id="credit"></div>
<div class="veil"></div>
<div class="grain"></div>
<div class="top-veil"></div>
<div class="bottom-veil"></div>
<div class="dimmer" id="dimmer"></div>

<main class="stage">

  <header class="top">
    <div class="dates">
      <div class="hijri" id="hijri">—</div>
      <div class="greg" id="greg">—</div>
      <div class="rule"></div>
    </div>

    <div class="markets">
      <div class="wxline"><span class="wxt" id="wx-temp"></span><span class="wxd" id="wx-desc"></span></div>
      <div class="wxsub"><span id="wx-city">الرياض</span><span class="wxr" id="wx-range"></span></div>
      <div class="rule l"></div>
    </div>
  </header>

  <section class="mid">
    <div class="clockwrap">
      <div class="clock">
        <span class="ampm" id="ck-ap">—</span><span class="d" id="ck-h">--</span><span class="sep">:</span><span class="d" id="ck-m">--</span>
      </div>
      <div class="subline"><span class="dot"></span><span id="clock-sub">بتوقيت الرياض</span></div>
    </div>

    <div class="week">
      <div class="hd" id="week-hd">هذا الأسبوع</div>
      <ul id="week-list"><li class="empty">جارٍ التحميل…</li></ul>
    </div>
  </section>

  <footer class="bottom">
    <div class="panel p-prayer">
      <div class="label" id="prayer-label">الصلاة القادمة</div>
      <div class="big"><span id="prayer-name">—</span><span class="num" id="prayer-time"></span></div>
      <div class="sub" id="prayer-count">—</div>
    </div>

    <div class="panel p-mid">
      <div class="label" id="ramadan-label">رمضان ١٤٤٨</div>
      <div class="big"><span class="num" id="ramadan-days">—</span></div>
      <div class="sub" id="ramadan-sub">—</div>
    </div>

    <div class="panel p-match">
      <div class="label">المباريات</div>
      <div class="mrow" id="match-row">
        <div class="none-week">لا شيء هذا الأسبوع</div>
      </div>
    </div>
  </footer>

</main>

<script>
// daily background: one photo per Riyadh day, deterministic
const BGS = [
__BG_SET__
];
// the app passes the chosen city in the URL fragment: #city=..&lat=..&lon=..&tz=..
const _Q = new URLSearchParams((location.hash || '').replace(/^#/, ''));
const _list = k => (_Q.get(k) || '').split(',').map(x=>x.trim()).filter(Boolean);
const _num = (k, d) => { const v = parseFloat(_Q.get(k)); return isNaN(v) ? d : v; };
const CONFIG = {
  city: _Q.get('city') || 'الرياض',
  latitude: _num('lat', 24.7136),
  longitude: _num('lon', 46.6753),
  timezone: _Q.get('tz') || 'Asia/Riyadh',
  // #loc=auto: city, coordinates and time zone from the internet connection (cached; #city/#lat/#lon until then)
  autoLocation: _Q.get('loc') === 'auto',
  // #mosque=<Mawaqit slug>: the mosque's own adhan, iqama and Jumu'a times instead of calculated ones
  mosque: (_Q.get('mosque') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 160),
  prayerMethod: 4,
  // followed teams in priority order: #teams=id,id,... (up to 10); older builds send team1/team2
  teamIds: (_Q.has('teams') ? _Q.get('teams').split(',')
            : [_Q.has('team1') ? _Q.get('team1') : '136013', _Q.has('team2') ? _Q.get('team2') : '136137'])
    .map(x=>(x||'').trim()).filter(x=>/^\d+$/.test(x)).slice(0, 10),
  sportsKey: '123',
  // #fdkey=: a free football-data.org key (kept on the TV only): the next five games of each followed club it
  // covers (European leagues, Champions League), home and away; the other clubs stay on TheSportsDB
  fdKey: (_Q.get('fdkey') || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 64),
  fdNative: _Q.get('fdnative') === '1',
  // the card beside the clock: auto (the four in turn, every 30 s) | verse | prayers | forecast | matches | none
  // (#week=0 from older builds = none; the TV-shows card was removed, so an old #panel=shows gets auto)
  panel: (p => ['auto','prayers','forecast','matches','verse','none'].includes(p) ? p : 'auto')
         (_Q.get('panel') || (_Q.get('week') === '0' ? 'none' : 'auto')),
  matchesPerPage: 2,
  matchPageMs: 15000,
  // minutes from adhan to iqama (Ministry of Islamic Affairs defaults); Friday Dhuhr has none
  iqama: {Fajr:25, Dhuhr:20, Asr:20, Maghrib:10, Isha:20},
  weekWindowDays: 7,
  // minutes between background photos: #photos=5|10|15|30|60 (anything else = 30)
  photoMinutes: (m => [5,10,15,30,60].includes(m) ? m : 30)(_num('photos', 30)),
  // #widget=1: only the card, on a transparent page (the launcher's home screen shows it)
  widget: _Q.get('widget') === '1',
  // #night=1: darken the screen gradually from 21:00 to 07:00 (a setting in the app, off by default)
  nightDim: _Q.get('night') === '1',
  adhkar: _Q.get('adhkar') === '1',   // morning and evening adhkar beside the clock in their hours (settings)
};
// Aladhan's method for the fallback (no mosque, or Mawaqit unreachable): Umm al-Qura in Saudi Arabia, else MWL
const setMethod = () => { CONFIG.prayerMethod = CONFIG.timezone === 'Asia/Riyadh' ? 4 : 3; };
setMethod();

// ---------- automatic location (#loc=auto) ----------
const GEO_KEY = 'geo3';   // geo2 = Arabic names everywhere
const GEO_MAX_AGE = 6*3600*1000;
const validTz = tz => { try{ new Intl.DateTimeFormat('en', {timeZone: tz}); return true; }catch(e){ return false; } };
function applyGeo(g){
  if(!g || !isFinite(g.lat) || !isFinite(g.lon)) return;
  if(g.city) CONFIG.city = g.city;
  CONFIG.latitude = +g.lat; CONFIG.longitude = +g.lon;
  if(g.tz && validTz(g.tz)) CONFIG.timezone = g.tz;
  setMethod();
}
let GEO = null;
if(CONFIG.autoLocation){ try{ GEO = JSON.parse(localStorage.getItem(GEO_KEY) || 'null'); applyGeo(GEO); }catch(e){} }

// How the place is written: in an Arab country the Arabic name; elsewhere the country's own language in its own
// (Latin) letters, with the country: «Stuttgart, Deutschland», «München, Deutschland», «Wien, Österreich».
const ARAB = new Set('SA AE QA KW BH OM YE IQ SY JO LB PS EG LY TN DZ MA SD MR SO DJ KM'.split(' '));
// the language a country names its places in; countries with another script (Greek, Cyrillic, Asian…) get English
const LOCAL_LANG = {DE:'de', AT:'de', CH:'de', LI:'de', LU:'fr', FR:'fr', BE:'fr', MC:'fr', NL:'nl', IT:'it',
  SM:'it', ES:'es', MX:'es', AR:'es', CL:'es', CO:'es', PE:'es', PT:'pt', BR:'pt', TR:'tr', SE:'sv', NO:'nb',
  DK:'da', FI:'fi', IS:'is', PL:'pl', CZ:'cs', SK:'sk', SI:'sl', HR:'hr', BA:'bs', RS:'sr-Latn', HU:'hu', RO:'ro',
  AL:'sq', LT:'lt', LV:'lv', EE:'et', IE:'en', GB:'en', US:'en', CA:'en', AU:'en', NZ:'en', MY:'ms', ID:'id'};
const placeLang = cc => ARAB.has(cc) ? 'ar' : (LOCAL_LANG[cc] || 'en');
function countryName(cc, lang, fallback){
  try{ const n = new Intl.DisplayNames([lang], {type: 'region'}).of(cc); if(n && n !== cc) return n; }catch(e){}
  return fallback || cc;
}

// The place's name in that language, from Open-Meteo's GeoNames search: the nearest hit with that name
async function placeName(name, lat, lon, lang){
  try{
    const r = await fetchT('https://geocoding-api.open-meteo.com/v1/search?count=10&language=' + lang.split('-')[0]
                           + '&name=' + encodeURIComponent(name), 10000);
    const hits = ((await r.json()).results || []).map(x => ({x, d: Math.hypot(x.latitude - lat, (x.longitude - lon) * Math.cos(lat*Math.PI/180))}));
    hits.sort((a, b) => a.d - b.d);
    if(hits.length && hits[0].d < 0.4 && hits[0].x.name) return hits[0].x.name;   // ~40 km
  }catch(e){}
  return name;
}

/** «Stuttgart, Deutschland» abroad, «جدة» in an Arab country. */
async function displayPlace(g){
  const cc = String(g.cc || '').toUpperCase(), lang = placeLang(cc);
  const city = g.raw ? await placeName(g.raw, g.lat, g.lon, lang) : '';
  if(lang === 'ar' || !cc) return city || CONFIG.city;
  const country = countryName(cc, lang, g.country);
  return city ? city + ', ' + country : country;
}

/** Where the connection is (IP based: the city of the internet provider, usually the right one or a
 *  neighbour). Returns true when the place or time zone changed, so callers reload what depends on it. */
async function locate(force){
  if(!CONFIG.autoLocation) return false;
  if(!force && GEO && Date.now() - (GEO.at || 0) < GEO_MAX_AGE) return false;
  const sources = [
    ['https://get.geojs.io/v1/ip/geo.json', j => ({city: j.city, lat: +j.latitude, lon: +j.longitude, tz: j.timezone,
                                                    cc: j.country_code, country: j.country})],
    ['https://ipwho.is/', j => j.success === false ? null : ({city: j.city, lat: +j.latitude, lon: +j.longitude,
                                                    tz: j.timezone && j.timezone.id, cc: j.country_code, country: j.country})],
    ['https://ipapi.co/json/', j => ({city: j.city, lat: +j.latitude, lon: +j.longitude, tz: j.timezone,
                                                    cc: j.country_code, country: j.country_name})],
  ];
  let g = null;
  for(const [url, pick] of sources){
    try{
      const r = await fetchT(url, 10000);
      if(!r.ok) continue;
      g = pick(await r.json());
      if(g && isFinite(g.lat) && isFinite(g.lon) && (g.lat || g.lon)) break;
      g = null;
    }catch(e){}
  }
  if(!g) return false;
  const old = GEO;
  const same = old && old.raw === g.city && Math.abs(old.lat - g.lat) < 0.05 && Math.abs(old.lon - g.lon) < 0.05;
  g.raw = g.city;
  g.city = same && old.city ? old.city : await displayPlace(g);
  g.at = Date.now();
  GEO = g;
  try{ localStorage.setItem(GEO_KEY, JSON.stringify(g)); }catch(e){}
  const changed = !old || !same || old.tz !== g.tz || old.city !== g.city;
  applyGeo(g);
  return changed;
}

const GREG = 'ar-SA-u-ca-gregory-nu-arab';
const AR = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
const ar = s => String(s).replace(/[0-9]/g, d => AR[+d]);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');

function riyadhParts(d = new Date()){
  const f = new Intl.DateTimeFormat('en-GB',{
    timeZone: CONFIG.timezone, hour12:false,
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit'
  }).formatToParts(d).reduce((a,p)=>(a[p.type]=p.value,a),{});
  return { y:+f.year, mo:+f.month, d:+f.day, h:(+f.hour)%24, mi:+f.minute, s:+f.second };
}
function fmt12(h, mi){   // «٠١:٠٣ م»: two-digit hours, so the times line up
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${ar(pad(h12))}:${ar(pad(mi))} ${h < 12 ? 'ص' : 'م'}`;
}

function tickClock(){
  const p = riyadhParts();
  const h12 = p.h % 12 === 0 ? 12 : p.h % 12;
  // one box per digit: browsers ignore letter-spacing on Arabic digits, and ٤ reaches into the next digit
  const digits = s => [...s].map(ch => '<i>' + ch + '</i>').join('');
  const key = h12 + ':' + p.mi;
  if(key === tickClock.last) return;   // ticks every second, redraws once a minute
  tickClock.last = key;
  document.getElementById('ck-h').innerHTML = digits(ar(pad(h12)));   // two digits: ٠٢:٥١
  document.getElementById('ck-m').innerHTML = digits(ar(pad(p.mi)));
  document.getElementById('ck-ap').textContent = p.h < 12 ? 'ص' : 'م';
}

function tickDates(){
  const now = new Date();
  try{
    let h = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{
      timeZone: CONFIG.timezone, weekday:'long', day:'numeric', month:'long', year:'numeric'
    }).format(now);
    h = h.replace(/\s*هـ\s*$/,'').replace(/،\s*$/,'');
    document.getElementById('hijri').textContent = h + ' هـ';
  }catch(e){}
  try{
    document.getElementById('greg').textContent = new Intl.DateTimeFormat(GREG,{
      timeZone: CONFIG.timezone, weekday:'long', day:'numeric', month:'long', year:'numeric'
    }).format(now);
  }catch(e){}
}

const PRAYER_KEYS = ['Fajr','Dhuhr','Asr','Maghrib','Isha'];
const PRAYER_NAMES = {Fajr:'الفجر',Dhuhr:'الظهر',Asr:'العصر',Maghrib:'المغرب',Isha:'العشاء'};
let PRAYERS = [];

let DAY_TIMES = null;
function buildPrayers(t){
  DAY_TIMES = t;
  PRAYERS = PRAYER_KEYS.map(k=>{
    const [h,mi] = String(t[k]).split(':').map(Number);
    return {key:k, name:PRAYER_NAMES[k], h, mi};
  });
}

// Umm al-Qura: Fajr at 18.5°, Maghrib at sunset, Isha 90 min after Maghrib (120 in Ramadan),
// Asr at shadow factor 1. Same method as Aladhan's method 4, so the offline times match to a minute or two.
function computePrayers(){
  const p = riyadhParts(), lat = CONFIG.latitude, lng = CONFIG.longitude;
  const tz = Math.round((Date.UTC(p.y,p.mo-1,p.d,p.h,p.mi,p.s) - Date.now()) / 60000) / 60;
  const rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
  const fix = (a,b) => { a = a - b*Math.floor(a/b); return a < 0 ? a + b : a; };
  const jd0 = Date.UTC(p.y,p.mo-1,p.d)/86400000 + 2440587.5 - lng/(15*24);
  const sun = t => {
    const D = jd0 + t - 2451545;
    const g = fix(357.529 + .98560028*D, 360), q = fix(280.459 + .98564736*D, 360);
    const L = fix(q + 1.915*Math.sin(rad(g)) + .020*Math.sin(rad(2*g)), 360);
    const e = 23.439 - .00000036*D;
    const RA = fix(deg(Math.atan2(Math.cos(rad(e))*Math.sin(rad(L)), Math.cos(rad(L))))/15, 24);
    return {decl: deg(Math.asin(Math.sin(rad(e))*Math.sin(rad(L)))), eqt: q/15 - RA};
  };
  const noon = t => fix(12 - sun(t/24).eqt, 24);
  const angleTime = (angle, t, ccw) => {
    const d = sun(t/24).decl, n = noon(t);
    const T = deg(Math.acos((-Math.sin(rad(angle)) - Math.sin(rad(d))*Math.sin(rad(lat))) /
                            (Math.cos(rad(d))*Math.cos(rad(lat)))))/15;
    return n + (ccw ? -T : T);
  };
  const asrTime = t => {
    const d = sun(t/24).decl;
    const a = -deg(Math.atan(1/(1 + Math.tan(rad(Math.abs(lat - d))))));
    return angleTime(a, t, false);
  };
  const adj = h => h + tz - lng/15;
  const fajr = adj(angleTime(18.5, 5, true)), dhuhr = adj(noon(12)), asr = adj(asrTime(13));
  const sunrise = adj(angleTime(.833, 6, true));
  const maghrib = adj(angleTime(.833, 18, false));
  const isha = maghrib + (hijriMonthNow() === 9 ? 120 : 90)/60;
  const hm = h => { const m = Math.round(fix(h, 24)*60) % 1440; return pad(Math.floor(m/60)) + ':' + pad(m%60); };
  return {Fajr:hm(fajr), Sunrise:hm(sunrise), Dhuhr:hm(dhuhr), Asr:hm(asr), Maghrib:hm(maghrib), Isha:hm(isha)};
}

// ---------- the mosque's own times, from its Mawaqit page (#mosque=<slug>) ----------
// The page carries `let confData = {...};` with the year's timetable: calendar[month-1][day] =
// [fajr, shuruq, dhuhr, asr, maghrib, isha], iqamaCalendar[month-1][day] = 5 x ("+10" minutes after adhan, or
// "HH:MM"), and jumua. Kept in localStorage, so the times stay right offline; refreshed once a day.
const MOSQUE_KEY = 'mawaqit:' + CONFIG.mosque;
const DEFAULT_IQAMA = Object.assign({}, CONFIG.iqama);
let MOSQUE = (() => { try{ return CONFIG.mosque ? JSON.parse(localStorage.getItem(MOSQUE_KEY) || 'null') : null; }catch(e){ return null; } })();

async function loadMosque(){
  if(!CONFIG.mosque) return null;
  if(MOSQUE && Date.now() - (MOSQUE.at || 0) < 20*3600*1000) return MOSQUE;
  try{
    const r = await fetchT('https://mawaqit.net/en/' + CONFIG.mosque, 20000);
    if(!r.ok) throw 0;
    const m = (await r.text()).match(/confData\s*=\s*(\{.*?\});\s*\n/s);
    if(!m) throw 0;
    const c = JSON.parse(m[1]);
    if(!Array.isArray(c.calendar) || c.calendar.length !== 12) throw 0;
    MOSQUE = {at: Date.now(), name: c.name || '', calendar: c.calendar, iqamaCalendar: c.iqamaCalendar || [],
              iqamaEnabled: c.iqamaEnabled !== false, jumua: c.jumua || '', jumuaAsDuhr: !!c.jumuaAsDuhr};
    try{ localStorage.setItem(MOSQUE_KEY, JSON.stringify(MOSQUE)); }catch(e){}
  }catch(e){}   // keep yesterday's copy (the timetable is for the whole year)
  return MOSQUE;
}

const hhmm = t => /^\d{1,2}:\d{2}$/.test(String(t || '').trim());
const toMin = t => { const [h, m] = String(t).trim().split(':').map(Number); return h*60 + m; };

/** Today's times from the mosque's timetable, and its iqama minutes into CONFIG.iqama. null if missing. */
function mosqueToday(M){
  const p = riyadhParts();
  const day = M && M.calendar[p.mo - 1] && M.calendar[p.mo - 1][String(p.d)];
  if(!Array.isArray(day) || day.length < 6 || !day.every(hhmm)) return null;
  const t = {Fajr:day[0], Sunrise:day[1], Dhuhr:day[2], Asr:day[3], Maghrib:day[4], Isha:day[5]};
  const iq = M.iqamaCalendar[p.mo - 1] && M.iqamaCalendar[p.mo - 1][String(p.d)];
  PRAYER_KEYS.forEach((k, i) => {
    let mins = DEFAULT_IQAMA[k];
    const v = Array.isArray(iq) ? String(iq[i] || '').trim() : '';
    if(/^\+?\d{1,3}$/.test(v)) mins = +v.replace('+', '');
    else if(hhmm(v)){ const d = toMin(v) - toMin(t[k]); if(d >= 0 && d <= 120) mins = d; }
    CONFIG.iqama[k] = M.iqamaEnabled ? mins : 0;
  });
  // Friday: the Jumu'a time replaces Dhuhr (unless the mosque prays it at Dhuhr time)
  if(isFriday() && !M.jumuaAsDuhr && hhmm(M.jumua)) t.Dhuhr = M.jumua.trim();
  return t;
}

async function loadPrayers(){
  if(CONFIG.mosque){
    const t = mosqueToday(await loadMosque());
    if(t){
      buildPrayers(t);
      tickPrayer();
      tickRamadan();
      if(PANEL === 'prayers') renderPanel(false);
      return;
    }
  }
  Object.assign(CONFIG.iqama, DEFAULT_IQAMA);
  const p = riyadhParts();
  const url = `https://api.aladhan.com/v1/timings/${pad(p.d)}-${pad(p.mo)}-${p.y}`
            + `?latitude=${CONFIG.latitude}&longitude=${CONFIG.longitude}`
            + `&method=${CONFIG.prayerMethod}&timezonestring=${encodeURIComponent(CONFIG.timezone)}`;
  try{
    const r = await fetchT(url, 12000);
    const j = await r.json();
    if(!j?.data?.timings?.Fajr) throw 0;
    buildPrayers(j.data.timings);
  }catch(e){
    try{ buildPrayers(computePrayers()); }catch(_){}
  }
  tickPrayer();
  tickRamadan();   // Ramadan mode needs the prayer times
  if(PANEL === 'prayers') renderPanel(false);
}

const UNIT = {
  day: {one:'يوم', two:'يومين', few:'أيام', many:'يوم'},
  hour:{one:'ساعة', two:'ساعتين', few:'ساعات', many:'ساعة'},
  min: {one:'دقيقة', two:'دقيقتين', few:'دقائق', many:'دقيقة'}
};
function qty(n,u){
  if(n === 2) return u.two;
  if(n >= 3 && n <= 10) return `${ar(n)} ${u.few}`;
  return `${ar(n)} ${u.many}`;
}
function humanRemaining(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), out = [];
  if(h) out.push(qty(h,UNIT.hour));
  if(m || !h) out.push(qty(m,UNIT.min));
  return out.join(' و ');
}
function shortRemaining(ms){
  const d = Math.floor(ms/86400000), h = Math.floor((ms%86400000)/3600000);
  const out = [];
  if(d) out.push(qty(d,UNIT.day));
  if(h && out.length < 2) out.push(qty(h,UNIT.hour));
  if(!out.length) out.push(qty(Math.max(1, Math.ceil(ms/60000)), UNIT.min));
  return out.join(' و ');
}

function isFriday(){
  return new Intl.DateTimeFormat('en-US',{timeZone:CONFIG.timezone,weekday:'short'}).format(new Date()) === 'Fri';
}
function prayerName(x){ return x.key === 'Dhuhr' && isFriday() ? 'الجمعة' : x.name; }

function tickPrayer(){
  const elL=document.getElementById('prayer-label'),
        elN=document.getElementById('prayer-name'),
        elT=document.getElementById('prayer-time'),
        elC=document.getElementById('prayer-count'),
        panel=document.querySelector('.p-prayer');
  if(!PRAYERS.length) return;
  const p = riyadhParts();
  const mins = p.h*60 + p.mi + p.s/60;

  // between adhan and iqama: show the iqama countdown
  const cur = PRAYERS.find(x=>{
    const at = x.h*60 + x.mi;
    const gap = (x.key === 'Dhuhr' && isFriday()) ? 0 : (CONFIG.iqama[x.key] || 0);
    return mins >= at && mins < at + gap;
  });
  if(cur){
    const left = (cur.h*60 + cur.mi + CONFIG.iqama[cur.key]) - mins;
    panel.classList.add('now');
    elL.textContent = 'حان الآن';
    elN.textContent = prayerName(cur);
    elT.textContent = fmt12(cur.h, cur.mi);
    elC.innerHTML = 'الإقامة بعد <b>' + humanRemaining(Math.max(60, Math.ceil(left)*60)) + '</b>';
    return;
  }

  panel.classList.remove('now');
  elL.textContent = 'الصلاة القادمة';
  let next = PRAYERS.find(x => (x.h*60+x.mi) > mins);
  const leftM = next ? (next.h*60 + next.mi) - mins
                     : (PRAYERS[0].h*60 + PRAYERS[0].mi) + 1440 - mins;
  if(!next) next = PRAYERS[0];
  elN.textContent = prayerName(next);
  elT.textContent = fmt12(next.h, next.mi);
  elC.innerHTML = 'بعد <b>' + humanRemaining(Math.max(0, Math.round(leftM*60))) + '</b>';
}

let RAM_CACHE = {day:'', val:null};
function ramadanStart(){
  const dayKey = new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone}).format(new Date());
  if(RAM_CACHE.day === dayKey) return RAM_CACHE.val;
  const fmt = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,month:'numeric'});
  let found = null;
  for(let i=0;i<400;i++){
    const d = new Date(Date.now()+i*86400000);
    if(fmt.format(d) === '9'){
      const p = riyadhParts(d);
      const hy = +new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,year:'numeric'})
        .format(d).replace(/[^0-9]/g,'');
      found = {y:p.y, mo:p.mo, d:p.d, hy};
      break;
    }
  }
  RAM_CACHE = {day: dayKey, val: found};
  return found;
}
function hijriYearNow(){
  try{
    return +new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,year:'numeric'})
      .format(new Date()).replace(/[^0-9]/g,'');
  }catch(e){ return 1448; }
}
function hijriMonthNow(){
  try{
    return +new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:CONFIG.timezone,month:'numeric'})
      .format(new Date()).replace(/[^0-9]/g,'');
  }catch(e){ return 0; }
}
function tickRamadan(){
  const elL=document.getElementById('ramadan-label'),
        elD=document.getElementById('ramadan-days'),
        elS=document.getElementById('ramadan-sub');

  // ---- Ramadan mode: iftar / suhoor instead of the countdown ----
  if(hijriMonthNow() === 9 && PRAYERS.length){
    const rp = riyadhParts();
    const mins = rp.h*60 + rp.mi + rp.s/60;
    const fajr = PRAYERS.find(p=>p.key==='Fajr');
    const maghrib = PRAYERS.find(p=>p.key==='Maghrib');
    const fajrM = fajr.h*60 + fajr.mi, maghribM = maghrib.h*60 + maghrib.mi;
    let label, targetM;
    if(mins < fajrM){ label = 'الإمساك'; targetM = fajrM; }
    else if(mins < maghribM){ label = 'الإفطار'; targetM = maghribM; }
    else { label = 'الإمساك'; targetM = fajrM + 1440; }
    const th = Math.floor((targetM % 1440) / 60), tm = targetM % 60;
    elL.textContent = label;
    elD.innerHTML = ar(th%12===0?12:th%12) + ':' + ar(String(tm).padStart(2,'0'))
                  + ' <span class="unit">' + (th < 12 ? 'ص' : 'م') + '</span>';
    elS.innerHTML = 'بعد <b>' + humanRemaining(Math.max(0, Math.round((targetM - mins)*60))) + '</b>';
    return;
  }

  // ---- countdown mode ----
  const st = ramadanStart();
  elL.textContent = 'رمضان ' + ar(st ? st.hy : hijriYearNow());
  if(!st){ elD.textContent='—'; elS.textContent=''; return; }
  const rp2 = riyadhParts();
  const days = Math.max(0, Math.round(
    (Date.UTC(st.y, st.mo-1, st.d) - Date.UTC(rp2.y, rp2.mo-1, rp2.d)) / 86400000));
  elD.innerHTML = ar(days) + ' <span class="unit">يوم</span>';
  elS.textContent = days === 0 ? 'رمضان مبارك'
    : 'يبدأ ' + new Intl.DateTimeFormat(GREG,{timeZone:CONFIG.timezone,weekday:'long',day:'numeric',month:'long'})
        .format(new Date(Date.UTC(st.y, st.mo-1, st.d, 12)));
}

const TEAM_AR = __TEAMS_AR__;   // assets/shared/teams-ar.json
// match "Al-Adalah", "Al Adalah", "Al-Adalah FC" and "AL ADALAH" to the same entry, and "Atlético" to "Atletico"
// (the same key as team_key() in .github/tools/team_ids.py and Arabic.key(); tests/team_ids_test.py compares them)
const teamKey = s => String(s).replace(/ı/g,'i').replace(/ß/g,'ss').normalize('NFKD').replace(/[\u0300-\u036f]+/g,'')
  .toLowerCase().replace(/\b(fc|sc|cf|afc|club|saudi club)\b/g,'')
  .replace(/[^a-z0-9]+/g,' ').trim().replace(/^al /,'al');
const TEAM_BY_ID = __TEAMS_BY_ID__;   // assets/shared/teams.json: TheSportsDB id -> Arabic
const TEAM_EN = __TEAMS_EN__;         // and -> English, to find the club on football-data.org
const TEAM_KEYS = {};
// first entry wins on a clash: the Saudi "Al-Faisaly" before the Jordanian "Al Faisaly"
for(const [en, arName] of Object.entries(TEAM_AR)) if(!(teamKey(en) in TEAM_KEYS)) TEAM_KEYS[teamKey(en)] = arName;
let MATCHES_LOADED = false;   // a refresh answered; until then the saved row stays
let MATCHES = {};   // team id -> next event
let RESULTS = {};   // team id -> recent events
let NEXT_LIST = {};   // team id -> upcoming events

// ---------- team names in Arabic ----------
// 1) built-in table, 2) the Arabic label on Wikidata (cached on the device), 3) transliteration meanwhile
const AR_NAMES = (()=>{ try{ return JSON.parse(localStorage.getItem('arNames') || '{}'); }catch(e){ return {}; } })();
const AR_PENDING = new Set();
const AR_KIND = {team:/football|soccer|club|team|منتخب|نادي/i};
const hasArabic = s => /[؀-ۿ]/.test(s);

const TL_WORDS = {the:'ذا',of:'أوف',and:'آند',a:'إيه',in:'إن',on:'أون',to:'تو',us:'أس',fc:'',cf:'',sc:'',afc:'',
  united:'يونايتد',city:'سيتي',real:'ريال',club:'كلوب',sporting:'سبورتنغ',saint:'سانت',st:'سانت'};
const TL_LETTERS = {a:'إيه',b:'بي',c:'سي',d:'دي',e:'إي',f:'إف',g:'جي',h:'إتش',i:'آي',j:'جيه',k:'كيه',l:'إل',m:'إم',
  n:'إن',o:'أو',p:'بي',q:'كيو',r:'آر',s:'إس',t:'تي',u:'يو',v:'في',w:'دبليو',x:'إكس',y:'واي',z:'زد'};
function translit(en){
  const map = {sh:'ش',kh:'خ',th:'ث',dh:'ذ',gh:'غ',ch:'تش',ph:'ف',ck:'ك',qu:'كو',ou:'و',oo:'و',ee:'ي',
    a:'ا',b:'ب',c:'ك',d:'د',e:'ي',f:'ف',g:'ج',h:'ه',i:'ي',j:'ج',k:'ك',l:'ل',m:'م',n:'ن',o:'و',p:'ب',
    q:'ق',r:'ر',s:'س',t:'ت',u:'و',v:'ف',w:'و',x:'كس',y:'ي',z:'ز'};
  const start = {a:'أ',e:'إ',i:'إ',o:'أو',u:'أ'};
  const word = w => {
    if(hasArabic(w) || !/[A-Za-z0-9]/.test(w)) return w;
    const lw = w.toLowerCase();
    if(TL_WORDS[lw] !== undefined) return TL_WORDS[lw];
    if(/^[A-Z]{2,4}$/.test(w)) return lw.split('').map(c=>TL_LETTERS[c]).join(' ');   // CP, PSG
    if(/^al-/.test(lw)) return 'ال' + word(w.slice(3));
    let out = '', x = lw.replace(/(.)\1/g,'$1');
    for(let i = 0; i < x.length;){
      const two = i+1 < x.length ? map[x.slice(i,i+2)] : undefined;
      if(i === 0 && start[x[0]] && !two){ out += start[x[0]]; i++; continue; }
      if(two){ out += two; i += 2; continue; }
      const ch = x[i];
      if(ch === 'e' && i > 0){ i++; continue; }                         // short or silent e
      if(ch === 'c' && /[eiy]/.test(x[i+1] || '')){ out += 'س'; i++; continue; }
      out += /[0-9]/.test(ch) ? ar(ch) : (map[ch] || '');
      i++;
    }
    return out;
  };
  return String(en).replace(/&/g,' و ').replace(/\bAl (?=[A-Z])/g,'Al-')
    .split(/(\s+)/).map(word).join('').replace(/\s{2,}/g,' ').trim();
}

async function wikidataArabic(en, kind){
  const api = 'https://www.wikidata.org/w/api.php?format=json&origin=*';
  const r = await fetchT(`${api}&action=wbsearchentities&type=item&limit=7&language=en&search=${encodeURIComponent(en)}`, 10000);
  const hits = ((await r.json()).search || []).filter(h => AR_KIND[kind].test(h.description || ''));
  if(!hits.length) return '';
  const r2 = await fetchT(`${api}&action=wbgetentities&props=labels&languages=ar&ids=${hits.slice(0,3).map(h=>h.id).join('|')}`, 10000);
  const ents = (await r2.json()).entities || {};
  for(const h of hits.slice(0,3)){
    const l = ents[h.id] && ents[h.id].labels && ents[h.id].labels.ar;
    if(l && l.value) return l.value.replace(/\s*\([^)]*\)\s*/g,' ').replace(/^(نادي|فريق)\s+/,'').trim();
  }
  return '';
}

let arQueue = Promise.resolve();
function arName(en, kind, id){
  if(kind === 'team' && id && TEAM_BY_ID[id]) return TEAM_BY_ID[id];
  en = String(en || '').trim();
  if(!en || hasArabic(en)) return en;
  if(kind === 'team'){
    const k = TEAM_KEYS[teamKey(en)];
    if(k) return k;
  }
  const key = kind + ':' + en;
  if(AR_NAMES[key] !== undefined) return AR_NAMES[key] || translit(en);
  if(!AR_PENDING.has(key)){
    AR_PENDING.add(key);
    arQueue = arQueue.then(async ()=>{            // one lookup at a time
      try{
        AR_NAMES[key] = await wikidataArabic(en, kind);   // '' = Wikidata has none: keep the transliteration
        try{ localStorage.setItem('arNames', JSON.stringify(AR_NAMES)); }catch(e){}
        if(AR_NAMES[key]){ renderMatches(); renderPanel(false); }
      }catch(e){}                                    // offline: try again next time
      AR_PENDING.delete(key);
    });
  }
  return translit(en);
}
const teamAr = (s, id) => arName(s, 'team', id);

async function fetchNext(id){
  const r = await fetch(`https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}/eventsnext.php?id=${id}`,{cache:'no-store'});
  if(!r.ok) throw 0;
  const j = await r.json();
  if(j?.events) NEXT_LIST[id] = j.events;
  return (j?.events || [])[0] || null;
}
function toDate(ev){
  const s = ev.strTimestamp || `${ev.dateEvent}T${ev.strTime || '00:00:00'}`;
  return new Date(s.endsWith('Z') ? s : s+'Z');
}

// one slot per picked team: a result from the last 24h, else a fixture this week, else hidden
// A game is over once its status says so, or 2.5 h after kick-off; its score stays up for a day after that.
const FINAL = ['FT','AET','PEN','MATCH FINISHED'];
function finishedRecently(ev, now){
  if(!ev || ev.intHomeScore == null || ev.intAwayScore == null) return false;
  const k = toDate(ev).getTime(), end = k + 2.5*3600000;
  const over = FINAL.includes((ev.strStatus || '').toUpperCase()) ? now >= k : now >= end;
  return over && now - end < 86400000;
}
// Keep a score seen at the final whistle: the free API's "last games" list can lag, and "next game"
// moves on to the following fixture right away. Saved, so a restart within the day still shows it.
const KEPT = (()=>{ try{ return JSON.parse(localStorage.getItem('keptResults') || '{}'); }catch(e){ return {}; } })();
function keepResult(id, ev){
  if(!finishedRecently(ev, Date.now())) return;
  KEPT[id] = [ev, ...(KEPT[id] || []).filter(x => x.idEvent !== ev.idEvent && finishedRecently(x, Date.now()))];
  try{ localStorage.setItem('keptResults', JSON.stringify(KEPT)); }catch(e){}
}
function resultsFor(id){
  const seen = new Set();
  return [...(RESULTS[id] || []), ...(KEPT[id] || []), MATCHES[id]]
    .filter(ev => ev && ev.idEvent && !seen.has(ev.idEvent) && seen.add(ev.idEvent));
}

function matchSlot(id, now, shown){
  const done = resultsFor(id).filter(ev => finishedRecently(ev, now)).sort((a,b)=>toDate(b)-toDate(a))[0];
  if(done){
    if(shown.has(done.idEvent)) return '';          // both teams in the same game
    shown.add(done.idEvent);
    const day = new Intl.DateTimeFormat(GREG,{timeZone:CONFIG.timezone,weekday:'long'}).format(toDate(done));
    return `<div class="mblock">`
      + `<div class="big"><span>${esc(teamAr(done.strHomeTeam, done.idHomeTeam))} <span class="sc">${ar(+done.intHomeScore)} - ${ar(+done.intAwayScore)}</span> ${esc(teamAr(done.strAwayTeam, done.idAwayTeam))}</span></div>`
      + `<div class="sub">النتيجة النهائية · ${day}</div></div>`;
  }
  const ev = MATCHES[id];
  if(!ev || shown.has(ev.idEvent)) return '';
  const home = esc(teamAr(ev.strHomeTeam, ev.idHomeTeam)), away = esc(teamAr(ev.strAwayTeam, ev.idAwayTeam));
  const d = toDate(ev), diff = d - now;
  if(diff < -2.5*3600000 || diff > CONFIG.weekWindowDays * 86400000) return '';   // in progress stays on screen
  shown.add(ev.idEvent);
  const p = new Intl.DateTimeFormat('en-GB',{timeZone:CONFIG.timezone,hour:'2-digit',minute:'2-digit',hour12:false})
    .formatToParts(d).reduce((a,x)=>(a[x.type]=x.value,a),{});
  const t12 = ar(fmt12(+p.hour % 24, +p.minute));
  const live = diff <= 0 && ev.intHomeScore != null && ev.intAwayScore != null;
  const sub = ev.timeTbc ? `${matchDay(d)} · الوقت لم يُحدد`
    : diff > 0 ? `بعد ${shortRemaining(diff)} · ${t12}` : `<span class="live">مباشر</span> · ${liveStatus(ev, t12)}`;
  const mid = live ? ` <span class="sc">${ar(+ev.intHomeScore)} - ${ar(+ev.intAwayScore)}</span> ` : ' × ';
  return `<div class="mblock">`
       + `<div class="big"><span>${home}${mid}${away}</span></div>`
       + `<div class="sub">${sub}</div>`
       + `</div>`;
}

function liveStatus(ev, t12){
  const st = (ev.strStatus || '').toUpperCase();
  if(st === 'HT') return 'استراحة';
  if(['FT','AET','PEN'].includes(st)) return 'انتهت';
  const m = parseInt(ev.strProgress, 10);
  return isNaN(m) ? `بدأت ${t12}` : `الدقيقة ${ar(m)}`;
}

// while a picked team is playing, refresh that event every 2 minutes
async function loadLive(){
  const now = Date.now();
  await Promise.all(Object.entries(MATCHES).map(async ([id, ev])=>{
    if(!ev || !ev.idEvent) return;
    const k = toDate(ev).getTime();
    if(now < k - 5*60000 || now > k + 2.5*3600000) return;
    if(ev.fdId){   // a football-data game: its own live score (the screensaver: the home screen's, as shared)
      if(fdFromShared(id) !== undefined) return;
      try{ const j = await fdGet(`matches/${ev.fdId}`); MATCHES[id] = Object.assign({}, ev, fdEvent(j.match || j)); keepResult(id, MATCHES[id]); fdShare(); }
      catch(e){}
      return;
    }
    try{
      const r = await fetchT(`https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}/lookupevent.php?id=${ev.idEvent}`, 10000);
      const j = await r.json();
      const fresh = (j.events || [])[0];
      if(fresh && fresh.idEvent === ev.idEvent){ MATCHES[id] = Object.assign({}, ev, fresh); keepResult(id, MATCHES[id]); }
    }catch(e){}
  }));
  renderMatches();
}

// Every followed team with something to show, two at a time; the page turns every 15 s.
let MATCH_PAGE = 0;
function renderMatches(turn){
  const now = Date.now(), shown = new Set();
  const slots = CONFIG.teamIds.map(id => matchSlot(id, now, shown)).filter(Boolean);
  const row = document.getElementById('match-row');
  // no team picked: the place stays empty (no label, no «لا شيء هذا الأسبوع»)
  const box = row.closest('.p-match');
  if(box) box.style.visibility = CONFIG.teamIds.length ? '' : 'hidden';
  if(!CONFIG.teamIds.length){ row.innerHTML = ''; return; }
  if(!slots.length){ if(!MATCHES_LOADED && row.firstElementChild) return; row.innerHTML = '<div class="none-week">لا شيء هذا الأسبوع</div>'; return; }
  const per = CONFIG.matchesPerPage, pages = Math.ceil(slots.length / per);
  if(turn) MATCH_PAGE++;
  MATCH_PAGE %= pages;
  row.innerHTML = slots.slice(MATCH_PAGE * per, MATCH_PAGE * per + per).join('');
  if(turn && pages > 1){ row.classList.remove('flip'); void row.offsetWidth; row.classList.add('flip'); }
}

// ---------- football-data.org (#fdkey): the next five games, home and away, for the clubs it covers ----------
const FD = 'https://api.football-data.org/v4/';
const FD_COMPS = ['PD', 'PL', 'SA', 'BL1', 'FL1', 'DED', 'PPL', 'CL'];   // the free plan's club competitions
const FD_KEY = 'fdIndex2';   // 2: fdIndex1 could hold a list missing a league (kept 30 days)
const sleep = ms => new Promise(r => setTimeout(r, ms));
let FD_PAUSE = CONFIG.fdNative ? 0 : 6500;   // in the app its proxy spaces requests already (10 a minute allowed)
async function fdGet(path){
  const c = new AbortController(), t = setTimeout(() => c.abort(), 90000);   // the app queues them 6.5 s apart
  try{
    // in the app (#fdnative=1) a plain request: the app adds the key (FdProxy). In a browser, the key header.
    const opts = {cache: 'no-store', signal: c.signal};
    if(!CONFIG.fdNative) opts.headers = {'X-Auth-Token': CONFIG.fdKey};
    const r = await fetch(FD + path, opts);
    if(!r.ok) throw r.status;
    return await r.json();
  }finally{ clearTimeout(t); }
}
// club name -> football-data id, from the competitions' team lists: built once a month, slowly (10 calls a minute)
try{ localStorage.removeItem('fdIndex1'); }catch(e){}
let FD_INDEX = (() => { try{ return JSON.parse(localStorage.getItem(FD_KEY) || 'null'); }catch(e){ return null; } })();
let FD_BUILDING = null;
function fdIndex(){
  if(FD_INDEX && Date.now() - FD_INDEX.at < 30 * 86400000) return Promise.resolve(FD_INDEX.map);
  if(FD_BUILDING) return FD_BUILDING;
  FD_BUILDING = (async () => {
    const map = {};
    let missed = 0;
    for(let i = 0; i < FD_COMPS.length; i++){
      if(i) await sleep(FD_PAUSE);
      try{
        for(const t of (await fdGet(`competitions/${FD_COMPS[i]}/teams`)).teams || [])
          for(const n of [t.name, t.shortName]) if(n && !(teamKey(n) in map)) map[teamKey(n)] = t.id;
      }catch(e){ missed++; if(e === 401 || e === 403) break; }   // a wrong key: no use asking the rest
    }
    // kept 30 days only when every league answered: a list missing La Liga (refused once) left Barcelona on
    // TheSportsDB for a month on the home screen. A partial list is used now and asked again in 10 minutes.
    if(!missed){ FD_INDEX = {at: Date.now(), map}; try{ localStorage.setItem(FD_KEY, JSON.stringify(FD_INDEX)); }catch(e){} }
    else if(Object.keys(map).length) FD_INDEX = {at: Date.now() - 30 * 86400000 + 600000, map};
    FD_BUILDING = null;
    return map;
  })();
  return FD_BUILDING;
}
// a football-data club name -> the TheSportsDB id we know it by (for its curated Arabic name)
const TEAM_ID_BY_KEY = {};
for(const [id, en] of Object.entries(TEAM_EN)) if(!(teamKey(en) in TEAM_ID_BY_KEY)) TEAM_ID_BY_KEY[teamKey(en)] = id;
const fdTeamId = t => TEAM_ID_BY_KEY[teamKey(t.name || '')] || TEAM_ID_BY_KEY[teamKey(t.shortName || '')] || null;
const FD_STATUS = {FINISHED: 'FT', AWARDED: 'FT', PAUSED: 'HT', IN_PLAY: '1H', LIVE: '1H'};
/** a football-data match in TheSportsDB's shape, so the rest of the page needs no change */
function fdEvent(m){
  const ft = (m.score && m.score.fullTime) || {};
  return {idEvent: 'fd' + m.id, fdId: m.id, strTimestamp: m.utcDate,
          strHomeTeam: m.homeTeam.shortName || m.homeTeam.name, idHomeTeam: fdTeamId(m.homeTeam),
          strAwayTeam: m.awayTeam.shortName || m.awayTeam.name, idAwayTeam: fdTeamId(m.awayTeam),
          intHomeScore: ft.home == null ? null : ft.home, intAwayScore: ft.away == null ? null : ft.away,
          strStatus: FD_STATUS[m.status] || 'NS', strProgress: m.minute || '',
          timeTbc: m.status === 'SCHEDULED'};
}
// Only the home screen asks football-data. It hands its games to the screensaver app (window.UrTVShare →
// the launcher keeps them), and the screensaver takes them (window.UrTVShared) instead of asking the site:
// one source of requests for the free plan's 10 a minute. 'NOHOME': no home screen that shares (an older one).
function fdShared(){
  if(!window.UrTVShared) return undefined;   // not the screensaver app
  let s; try{ s = window.UrTVShared.get(); }catch(e){ return undefined; }
  if(s === 'NOHOME') return undefined;
  let j = null; try{ j = JSON.parse(s || 'null'); }catch(e){}
  // nothing shared for 6 hours (the home screen's card off, or never opened): ask through the app's one queue
  if(!j || !j.at || Date.now() - j.at > 6 * 3600000) return undefined;
  return j;
}
function fdShare(){
  if(!window.UrTVShare) return;
  const teams = {};
  for(const id of CONFIG.teamIds)
    if((NEXT_LIST[id] || []).some(ev => String(ev.idEvent).startsWith('fd')))
      teams[id] = {next: NEXT_LIST[id], match: MATCHES[id] || null, results: RESULTS[id] || []};
  try{ window.UrTVShare.share(JSON.stringify({at: Date.now(), teams})); }catch(e){}
}
/** from the home screen's list: true if it has this club (else undefined: not shared here) */
function fdFromShared(id){
  const sh = fdShared();
  if(sh === undefined) return undefined;
  const t = sh && sh.teams && sh.teams[id];
  if(!t){   // the home screen has not shared it (yet, or not a football-data club)
    return (NEXT_LIST[id] || []).some(ev => String(ev.idEvent).startsWith('fd')) ? true : false;
  }
  const old = MATCHES[id];
  NEXT_LIST[id] = t.next || [];
  const ev = t.match || NEXT_LIST[id][0];
  if(ev){ if(old && old.idEvent !== ev.idEvent) keepResult(id, old); MATCHES[id] = ev; }
  if(t.results && t.results.length) RESULTS[id] = t.results;
  return true;
}
/** true when football-data answered for this club (then TheSportsDB is not asked) */
async function fdLoad(id){
  if(!CONFIG.fdKey) return false;
  const sh = fdFromShared(id);
  if(sh !== undefined) return sh;   // the screensaver app: the home screen's games, no request of its own
  try{ return await fdLoadNow(id); }
  catch(e){   // a refused or failed refresh: keep football-data's games if this club has them already
    if((NEXT_LIST[id] || []).some(ev => String(ev.idEvent).startsWith('fd'))) return true;
    throw e;
  }
}
async function fdLoadNow(id){
  const en = TEAM_EN[id];
  if(!en) return false;
  const fid = (await fdIndex())[teamKey(en)];
  if(!fid) return false;   // not in the free competitions (a Saudi club): TheSportsDB
  const COMING = ['SCHEDULED', 'TIMED', 'IN_PLAY', 'PAUSED'];
  let up, done = null;
  // all the coming games (no limit: with limit=5 the site gave the season's LAST five, in May), the nearest five here
  try{
    up = ((await fdGet(`teams/${fid}/matches?status=${COMING.join(',')}`)).matches || [])
      .sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate)).slice(0, 5);
  }
  catch(e){
    if(e !== 400) throw e;
    // the filtered request refused: the season's games with no filter at all, sorted out here
    const all = ((await fdGet(`teams/${fid}/matches?limit=200`)).matches || [])
      .sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate));
    up = all.filter(m => COMING.includes(m.status)).slice(0, 5);
    const since = Date.now() - 3 * 86400000;
    done = all.filter(m => m.status === 'FINISHED' && new Date(m.utcDate).getTime() >= since);
  }
  const evs = up.map(fdEvent);
  NEXT_LIST[id] = evs;
  const ev = evs[0];
  if(ev){ if(MATCHES[id] && MATCHES[id].idEvent !== ev.idEvent) keepResult(id, MATCHES[id]); MATCHES[id] = ev; }
  // the last results: by status only (the free plan refused dateFrom/dateTo, «Your API token is invalid»)
  if(!done) try{
    const since = Date.now() - 3 * 86400000;
    done = ((await fdGet(`teams/${fid}/matches?status=FINISHED&limit=100`)).matches || [])
      .filter(m => new Date(m.utcDate).getTime() >= since);
  }catch(e){}
  if(done) RESULTS[id] = done.map(fdEvent);
  return true;
}

async function fetchLast(id){
  const r = await fetch(`https://www.thesportsdb.com/api/v1/json/${CONFIG.sportsKey}/eventslast.php?id=${id}`,{cache:'no-store'});
  if(!r.ok) throw 0;
  const j = await r.json();
  return j.results || [];
}
async function loadMatches(){
  // never throw away a good fixture or result on a failed refresh
  let answered = 0;
  await Promise.all(CONFIG.teamIds.map(async id=>{
    try{ if(await fdLoad(id)){ answered++; return; } }catch(e){}   // football-data first, when it has the club
    try{
      const ev = await fetchNext(id); answered++;
      if(ev){ if(MATCHES[id] && MATCHES[id].idEvent !== ev.idEvent) keepResult(id, MATCHES[id]); MATCHES[id] = ev; }
    }catch(e){}
    try{ const l = await fetchLast(id); answered++; if(l.length) RESULTS[id] = l; }catch(e){}
  }));
  if(!answered && CONFIG.teamIds.length) return;    // offline: keep what is shown (the saved panels)
  fdShare();
  MATCHES_LOADED = true;
  renderMatches();
  if(PANEL === 'matches') renderPanel(false);
}

async function fetchT(url, ms){
  const c = new AbortController(); const id = setTimeout(()=>c.abort(), ms||12000);
  try{ return await fetch(url,{cache:'no-store', signal:c.signal}); }
  finally{ clearTimeout(id); }
}

// Yahoo has no CORS headers: try it directly (works inside the app), then through public CORS gateways
const WEEK_ROWS = 5;   // rows on the card beside the clock (a longer list pages through)

// ---- the morning and evening adhkar (settings: on or off). Morning from the Fajr adhan to 09:00, evening
// 21:00 to midnight, the place's time: then they take the card beside the clock whatever card is picked, one
// dhikr at a time (longer ones stay longer). The Quran in them is fetched (assets/shared/adhkar.json, by CI from
// the Quran API, like the verses of the day), never typed; without it those items are left out.

/** the items to show: a Quran item only when all its verses were fetched */
function adhkarItems(kind){
  const byRef = {};
  for(const v of ADHKAR_QURAN) byRef[v.ref] = v;
  return ADHKAR[kind].items.filter(it => !it.q || it.q.every(r => byRef[r])).map(it => !it.q ? it : Object.assign({}, it, {
    verses: it.q.map(r => byRef[r]),
    src: it.src + (it.q.length === 1 ? ' · ' + byRef[it.q[0]].surah + ' ' + ar(byRef[it.q[0]].ayah) : ''),
  }));
}
/** 'morning' | 'evening' | null now (the place's time); morning starts at today's Fajr (05:00 until it is known) */
function adhkarNow(){
  if(!CONFIG.adhkar) return null;
  const p = riyadhParts(), now = p.h * 60 + p.mi;
  let fajr = 5 * 60;
  if(DAY_TIMES && DAY_TIMES.Fajr){ const [h, mi] = String(DAY_TIMES.Fajr).split(':').map(Number); if(!isNaN(h)) fajr = h * 60 + mi; }
  if(now >= fajr && now < 9 * 60) return 'morning';
  if(now >= 21 * 60) return 'evening';
  return null;
}
const repText = n => n === 1 ? 'مرة واحدة' : n === 100 ? 'مئة مرة' : `${ar(n)} ${n <= 10 ? 'مرات' : 'مرة'}`;
let ADHKAR_KIND = null, ADHKAR_I = 0, ADHKAR_AT = 0;
function adhkarRows(){
  const items = ADHKAR_KIND ? adhkarItems(ADHKAR_KIND) : [];
  if(!items.length) return [];
  const it = items[ADHKAR_I % items.length];
  const body = it.verses
    ? `<span class="orn">﴿</span>${it.verses.map(v => esc(v.text) + (it.verses.length > 1 ? ` <span class="vn">(${ar(v.ayah)})</span>` : '')).join(' ')}<span class="orn">﴾</span>`
    : esc(it.t).replace(/صلى الله عليه وسلم/g, '<span class="saw">ﷺ</span>');
  const len = it.verses ? it.verses.map(v => v.text).join(' ').length : it.t.length;
  return [`<li class="quote dk${len > 260 ? ' xlong' : len > 150 ? ' long' : ''}">${body}</li>`,
          `<li class="src">${it.src ? esc(it.src) + ' · ' : ''}${repText(it.n)} · ${ar(ADHKAR_I % items.length + 1)} من ${ar(items.length)}</li>`];
}
/** how long a dhikr stays: by its length, 15 s to a minute */
function adhkarDwell(){
  const items = ADHKAR_KIND ? adhkarItems(ADHKAR_KIND) : [];
  const it = items[ADHKAR_I % (items.length || 1)];
  if(!it) return 30000;
  const len = it.verses ? it.verses.map(v => v.text).join(' ').length : it.t.length;
  return Math.max(15000, Math.min(60000, 8000 + len * 160));
}
/** every few seconds: the adhkar take the card in their hours and give it back after; the next dhikr in turn */
function tickAdhkar(){
  const kind = adhkarNow(), w = document.querySelector('.week');
  if(!w) return;
  if(kind && PANEL !== 'adhkar'){
    ADHKAR_KIND = kind; ADHKAR_I = 0; ADHKAR_AT = Date.now();
    PANEL = 'adhkar'; w.style.display = '';
    swapCard();
  } else if(kind && PANEL === 'adhkar'){
    if(kind !== ADHKAR_KIND){ ADHKAR_KIND = kind; ADHKAR_I = 0; ADHKAR_AT = Date.now(); swapCard(); }
    else if(Date.now() - ADHKAR_AT >= adhkarDwell()){ ADHKAR_I++; ADHKAR_AT = Date.now(); swapCard(); }
  } else if(!kind && PANEL === 'adhkar'){
    ADHKAR_KIND = null;
    PANEL = CONFIG.panel === 'auto' ? CARDS[0] : CONFIG.panel;
    if(CONFIG.panel === 'none'){ w.style.display = 'none'; return; }
    swapCard();
  }
}
/** the card's content changes with the fade (as in «auto») */
function swapCard(){
  const w = document.querySelector('.week');
  LIST_PAGE = 0;
  w.classList.add('swap');
  clearTimeout(rotateCard.t);
  rotateCard.t = setTimeout(() => { renderPanel(true); requestAnimationFrame(() => w.classList.remove('swap')); }, 380);
}

// ---- the card beside the clock: one of several contents, picked in the app
let FORECAST = [];
